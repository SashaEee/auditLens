# Contract-first Kubernetes manifest for the isolated Telegram worker.
# Values such as the signed image digest and SecretStore reference are rendered
# only by the controlled deployment pipeline. This file intentionally defines
# no Service, Ingress, port or HTTP listener.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auditlens-telegram-worker
  labels:
    app.kubernetes.io/name: auditlens-telegram-worker
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auditlens-telegram-worker-runtime
  annotations:
    auditlens.io/rotation_owner: platform-security
spec:
  secretStoreRef:
    name: approved-secret-manager
    kind: ClusterSecretStore
  target:
    name: auditlens-telegram-worker-runtime
    template:
      metadata:
        annotations:
          auditlens.io/secret-manager: approved-secret-manager
  data:
    - secretKey: database-url
      remoteRef:
        key: auditlens/telegram-worker/database-url
    - secretKey: telegram-session
      remoteRef:
        key: auditlens/telegram-worker/telegram-session
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auditlens-telegram-worker
  annotations:
    auditlens.io/alert_owner: platform-operations
    auditlens.io/rotation_owner: platform-security
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auditlens-telegram-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auditlens-telegram-worker
    spec:
      serviceAccountName: auditlens-telegram-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.internal/auditlens/telegram-worker@sha256:RENDERED_BY_CI
          imagePullPolicy: IfNotPresent
          command: ["auditlens-telegram-worker"]
          env:
            - name: DATABASE_SSLMODE
              value: verify-full
            - name: DATABASE_CA_FILE
              value: /var/run/auditlens/ca/ca.pem
          envFrom:
            - secretRef:
                name: auditlens-telegram-worker-runtime
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ca-bundle
              mountPath: /var/run/auditlens/ca
              readOnly: true
      volumes:
        - name: ca-bundle
          configMap:
            name: auditlens-managed-postgres-ca-bundle
---
# Cilium DNS policy prevents all other external destinations. The platform must
# bind managed-postgres to the named endpoint; a native Service is not created.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: auditlens-telegram-worker-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: auditlens-telegram-worker
  egress:
    - toFQDNs:
        - matchName: api.telegram.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: managed-postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
