<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AuditLens — Лазейки и уязвимости</title>
  <!-- Все vendor-ресурсы САМОРАЗМЕЩЕНЫ (/static/vendor/), как у основного сайта:
       внешние CDN (unpkg, Google Fonts) на части сетей недоступны и запрещены
       единой оболочкой (story 1.2). -->
  <link href="/static/vendor/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/loophole/loophole.css">
  <script src="/static/vendor/react.min.js"></script>
  <script src="/static/vendor/react-dom.min.js"></script>
  <script src="/static/vendor/babel.min.js"></script>
  <script>
  // Синхронизация темы (story 1.2): в same-origin iframe html.dark следует за
  // родительским документом через MutationObserver; при прямом открытии
  // (или cross-origin родителе) — через prefers-color-scheme.
  (function () {
    var root = document.documentElement;
    function applyDark(dark) { root.classList.toggle("dark", !!dark); }
    var media = window.matchMedia("(prefers-color-scheme: dark)");
    var synced = false;
    try {
      if (window.parent && window.parent !== window) {
        var parentRoot = window.parent.document.documentElement;
        applyDark(parentRoot.classList.contains("dark"));
        new MutationObserver(function () {
          applyDark(parentRoot.classList.contains("dark"));
        }).observe(parentRoot, { attributes: true, attributeFilter: ["class"] });
        synced = true;
      }
    } catch (e) { /* cross-origin родитель — уходим в fallback ниже */ }
    if (!synced) {
      applyDark(media.matches);
      media.addEventListener("change", function () { applyDark(media.matches); });
    }
  })();
  </script>
</head>
<body>
  <div id="loophole-root"></div>
  <script type="text/babel" src="/static/loophole/loophole.jsx"></script>
</body>
</html>
