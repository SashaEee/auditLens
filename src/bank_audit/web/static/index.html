<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AuditLens — Bank Market Intelligence</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<!-- Все vendor-ресурсы САМОРАЗМЕЩЕНЫ (/static/vendor/): внешние CDN (unpkg,
     jsdelivr, Google Fonts) на части сетей недоступны -> белая страница при
     живом сервере. Никаких внешних зависимостей у фронта быть не должно. -->
<link href="/static/vendor/fonts.css" rel="stylesheet">
<script src="/static/vendor/react.min.js"></script>
<script src="/static/vendor/react-dom.min.js"></script>
<script src="/static/vendor/babel.min.js"></script>
<script src="/static/vendor/chart.umd.js"></script>
<style>
:root{
  --paper:        oklch(98.5% 0.004 80);
  --paper-2:      oklch(96.8% 0.005 80);
  --surface:      oklch(100% 0 0);
  --ink:          oklch(17% 0.01 260);
  --ink-2:        oklch(38% 0.01 260);
  --ink-3:        oklch(52% 0.012 260);
  --ink-4:        oklch(68% 0.012 260);
  --hair:         oklch(91% 0.005 80);
  --hair-2:       oklch(86% 0.005 80);
  --accent:       oklch(55% 0.19 25);
  --accent-soft:  oklch(58% 0.18 25 / 0.08);
  /* Объект аудита — Сбер. Отдельный токен, а не --pos: зелёный здесь
     говорит «это наш банк», а не «здесь всё хорошо». Красным Сбер
     помечать нельзя — он читается как тревога (просьба ТБ), да и
     контраст ниже: 5.35 против 6.64 на светлой теме. */
  --sber:         oklch(46% 0.13 152);
  --sber-soft:    oklch(46% 0.13 152 / 0.10);
  --pos:          oklch(48% 0.10 150);
  --warn:         oklch(55% 0.13 75);
  --neg:          oklch(58% 0.18 25);
  /* Выделение и фокус — нейтральный графит, не красный: красный на вкладке
     значит «хуже, значимо, срочно» (волна D1) */
  --select:       oklch(40% 0.045 255);
  --select-soft:  oklch(40% 0.045 255 / 0.07);
  --qhl:          oklch(88% 0.09 85 / 0.55);
  --r-sm: 4px; --r: 6px; --r-lg: 10px;
  --shadow-1: 0 1px 0 oklch(0% 0 0 / .04), 0 1px 2px oklch(0% 0 0 / .03);
  --shadow-2: 0 1px 0 oklch(0% 0 0 / .04), 0 4px 16px oklch(0% 0 0 / .06);
  --rail: 232px; --topbar: 56px;

  /* Семантика источников и статусов — раньше жила хардкодом и не знала,
     что бывает тёмная тема. */
  --info:        oklch(52% 0.13 245);
  --info-soft:   oklch(95% 0.03 245);
  --legal:       oklch(48% 0.18 295);
  --legal-soft:  oklch(95% 0.04 295);
  --warn-ink:    oklch(45% 0.09 75);
  --neutral-ink: oklch(52% 0 0);

  /* Движение. Пружина по мотивам Apple: критическое демпфирование по
     умолчанию, отскок — только там, где жесту предшествовал импульс. */
  --ease-out:    cubic-bezier(.22,.61,.36,1);
  --ease-spring: cubic-bezier(.32,.72,0,1);
  --ease-bounce: cubic-bezier(.34,1.4,.64,1);
  --dur-press: 90ms;    /* отклик на нажатие — быстрее восприятия */
  --dur-quick: 180ms;   /* наведение, мелкие состояния */
  --dur-base:  280ms;   /* появление панелей, раскрытие */
  --dur-slow:  420ms;   /* крупные перестроения */
  /* Материалы. Толще поверхность — сильнее размытие и глубже тень. */
  --mat-chrome: blur(20px) saturate(180%);
  --mat-sheet:  blur(30px) saturate(180%);
  --press: .985;        /* масштаб нажатия */
}
html.dark{
  --paper:        oklch(15% 0.008 260);
  --paper-2:      oklch(18% 0.008 260);
  --surface:      oklch(20% 0.008 260);
  --ink:          oklch(96% 0.005 80);
  --ink-2:        oklch(76% 0.008 260);
  --ink-3:        oklch(64% 0.01 260);
  --ink-4:        oklch(48% 0.012 260);
  --hair:         oklch(26% 0.008 260);
  --hair-2:       oklch(32% 0.008 260);
  --accent:       oklch(68% 0.18 25);
  --sber:         oklch(70% 0.14 152);
  --sber-soft:    oklch(70% 0.14 152 / 0.14);
  --accent-soft:  oklch(68% 0.18 25 / 0.14);
  --pos:          oklch(72% 0.14 150);
  --warn:         oklch(80% 0.14 75);
  --neg:          oklch(70% 0.18 25);
  --select:       oklch(80% 0.05 255);
  --select-soft:  oklch(80% 0.05 255 / 0.10);
  --qhl:          oklch(60% 0.10 85 / 0.35);
  --shadow-1: 0 1px 0 oklch(0% 0 0 / .3), 0 1px 2px oklch(0% 0 0 / .25);
  --shadow-2: 0 1px 0 oklch(0% 0 0 / .3), 0 4px 16px oklch(0% 0 0 / .35);

  --info:        oklch(72% 0.12 245);
  --info-soft:   oklch(30% 0.05 245);
  --legal:       oklch(72% 0.14 295);
  --legal-soft:  oklch(30% 0.06 295);
  --warn-ink:    oklch(78% 0.10 75);
  --neutral-ink: oklch(68% 0 0);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Geist','Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-feature-settings:"zero","ss01"}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}
#app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{background:var(--paper);border-right:1px solid var(--hair);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 14px 14px;}
.rail-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px}
.rail-mark{width:26px;height:26px;color:var(--ink);display:block;flex:none}
.rail-brand h1{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.rail-brand small{font-size:10px;color:var(--ink-3);letter-spacing:.04em;font-family:'JetBrains Mono',monospace}
.rail-section{padding:14px 8px 6px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4)}
.rail-num{display:inline-block;width:18px;color:var(--ink-4);font-family:'JetBrains Mono',monospace;font-size:11px;margin-right:6px}
.nav-item{display:flex;align-items:center;gap:2px;padding:6px 10px;border-radius:4px;color:var(--ink-2);font-size:13px;font-weight:450;cursor:pointer;transition:background .12s,color .12s;position:relative;}
.nav-item:hover{background:var(--paper-2);color:var(--ink)}
.nav-item.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:2px;background:var(--ink);}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:auto}
.nav-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3)}
/* ── Анализ жалоб недели: карточки вместо сплошного текста (bfb-) ─────────── */
.bfb-list{display:flex;flex-direction:column;gap:12px}
.bfb-item{border:1px solid var(--hair);border-radius:10px;padding:14px 16px 12px;
  background:var(--surface);border-left:3px solid var(--hair-2);transition:border-color .12s}
.bfb-item:hover{border-color:var(--hair-2)}
.bfb-item.lvl-high{border-left-color:var(--accent);background:color-mix(in oklab,var(--accent),transparent 97%)}
.bfb-item.lvl-mid{border-left-color:var(--warn)}
.bfb-item.lvl-low{border-left-color:var(--hair-2)}
.bfb-item.lvl-new{border-left-color:var(--ink);background:color-mix(in oklab,var(--ink),transparent 97%)}
.bfb-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.bfb-badge{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  border-radius:14px;padding:2px 8px;border:1px solid var(--hair-2);color:var(--ink-3);white-space:nowrap;flex:0 0 auto}
.lvl-high .bfb-badge{border-color:color-mix(in oklab,var(--accent),transparent 55%);color:var(--accent)}
.lvl-mid .bfb-badge{border-color:color-mix(in oklab,var(--warn),transparent 55%);color:var(--warn)}
.lvl-new .bfb-badge{border-color:var(--ink-3);color:var(--ink)}
.bfb-title{font-family:Georgia,'Times New Roman',serif;font-size:16px;font-weight:500;margin:0;line-height:1.25;flex:1;min-width:0}
.bfb-body{font-size:13px;line-height:1.62;color:var(--ink-2);margin:0}
.bfb-body em{font-style:normal;color:var(--accent);font-weight:500}
.bfb-body strong{color:var(--ink);font-weight:600}
.bfb-act{margin-top:10px;padding-top:8px;border-top:1px dashed var(--hair-2);
  font-size:12px;line-height:1.55;color:var(--ink-2);display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:baseline}
.bfb-act-l{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
@media(max-width:640px){.bfb-act{grid-template-columns:1fr;gap:2px}}
.rv-radar-sub{font-size:11px;
  color:var(--ink-3);margin:2px 0 8px}
.rv-radar-chip.lvl-watch{border-color:color-mix(in oklab,var(--warn),transparent 60%);color:var(--ink-2)}
.rv-radar-chip.lvl-watch b{color:var(--warn)}
.trust-dots{display:inline-flex;gap:2px;align-items:center;margin-left:6px}
.trust-dots i{width:5px;height:5px;border-radius:50%;background:var(--hair-2);display:inline-block}
.trust-dots i.on{background:var(--pos)}
.nav-badge{margin-left:6px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in oklab,var(--accent),transparent 60%);
  border-radius:14px;padding:0px 4px;line-height:1.5;flex:0 0 auto}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--hair)}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:12px;font-weight:600}
.user-chip .nm{font-size:13px;font-weight:500;line-height:1.1}
.user-chip .role{font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono',monospace}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar);display:flex;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid var(--hair);background:color-mix(in oklab,var(--paper),transparent 8%);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;}
.crumb{display:flex;align-items:baseline;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-3)}
.crumb b{color:var(--ink);font-weight:500}
.crumb-idx{color:var(--ink-4)}
.tb-spacer{flex:1}
.tb-meta{display:flex;align-items:center;gap:14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3)}
.tb-meta .live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pos);margin-right:6px;vertical-align:middle;animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.icon-btn{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--ink-2);border:1px solid transparent;transition:background .12s,border-color .12s,color .12s;}
.icon-btn:hover{background:var(--paper-2);border-color:var(--hair);color:var(--ink)}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.content{padding:28px 28px 64px;max-width:1480px;width:100%;margin:0 auto}
.content:has(.loophole-host--active){padding:0;max-width:none;margin:0;display:flex;flex:1;min-height:0}
.loophole-host--active{width:100%;flex:1;min-height:0}
.loophole-page{width:100%;height:100%;min-height:0;margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:6px;font-size:13px;font-weight:500;letter-spacing:-.005em;transition:background .12s,border-color .12s,color .12s,transform .06s;border:1px solid transparent;}
.btn:active{transform:translateY(0.5px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{opacity:.88}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--hair-2)}
.btn-ghost:hover{background:var(--paper-2);color:var(--ink);border-color:var(--ink-4)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.surface{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);}
.surface-flat{background:var(--paper-2);border:1px solid var(--hair);border-radius:var(--r);}
.divide-y > * + *{border-top:1px solid var(--hair)}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.02em;border:1px solid var(--hair-2);background:var(--paper-2);color:var(--ink-2);white-space:nowrap;}
.badge.pos{color:var(--pos);border-color:color-mix(in oklab,var(--pos),transparent 70%);background:color-mix(in oklab,var(--pos),transparent 92%)}
.badge.neg{color:var(--neg);border-color:color-mix(in oklab,var(--neg),transparent 70%);background:color-mix(in oklab,var(--neg),transparent 92%)}
.badge.warn{color:var(--warn);border-color:color-mix(in oklab,var(--warn),transparent 70%);background:color-mix(in oklab,var(--warn),transparent 92%)}
.badge.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.input,.select{height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--hair-2);background:var(--surface);font-size:13px;color:var(--ink);transition:border-color .12s,box-shadow .12s;}
.input:hover,.select:hover{border-color:var(--ink-4)}
.input:focus,.select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in oklab,var(--ink),transparent 88%)}
.input::placeholder{color:var(--ink-4)}
.search-wrap{position:relative;flex:1;max-width:360px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search-wrap .input{padding-left:32px;width:100%}
.kbd{font-family:'JetBrains Mono',monospace;font-size:10px;padding:0px 4px;border:1px solid var(--hair-2);border-radius:4px;color:var(--ink-3);background:var(--paper)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--hair);background:var(--surface);position:sticky;top:0;white-space:nowrap;}
thead th.right{text-align:right}
tbody td{padding:12px 14px;border-bottom:1px solid var(--hair);font-size:13px;vertical-align:middle}
tbody td.right{text-align:right}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--paper-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr.is-sber td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.spark{display:block}
.hero-metric .num{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:96px;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums;}
.hero-metric .num em{font-style:italic;color:var(--accent)}
.delta{display:inline-flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:12px;}
.delta.pos{color:var(--pos)}
.delta.neg{color:var(--neg)}
.filter-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.tab-row{display:flex;gap:2px;padding:2px;border:1px solid var(--hair);background:var(--paper-2);border-radius:6px;}
.tab{height:26px;padding:0 12px;border-radius:4px;font-size:12px;font-weight:500;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;transition:background .12s,color .12s;}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.tab .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-4)}
.tab.active .n{color:var(--ink-3)}
.review{padding:16px 0;border-top:1px solid var(--hair)}
.review:first-child{border-top:0}
.review-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.review-text{color:var(--ink-2);font-size:13px;line-height:1.65;max-width:780px}
.review-meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-4);margin-top:6px}
.alert{display:flex;align-items:flex-start;gap:14px;padding:12px 16px;border-radius:8px;border:1px solid var(--hair);background:var(--surface);position:relative;overflow:hidden;}
.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}
.alert.error::before{background:var(--neg)}
.alert .a-icon{color:var(--warn);flex-shrink:0;margin-top:2px}
.alert.error .a-icon{color:var(--neg)}
.alert h4{font-size:13px;font-weight:600;margin-bottom:2px}
.alert p{font-size:12px;color:var(--ink-3);line-height:1.55}
.bar{height:4px;background:var(--paper-2);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .4s ease}
.bar.accent > i{background:var(--accent)}
.bar.pos > i{background:var(--pos)}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}
.skel{background:linear-gradient(90deg,var(--paper-2) 0,var(--hair) 40%,var(--paper-2) 80%);background-size:200px 100%;background-repeat:no-repeat;animation:shimmer 1.4s ease-in-out infinite;border-radius:4px;}
/* Одноколоночная оболочка (как в макете дизайнера — без правого рейла). */
.chat-shell{display:grid;grid-template-columns:1fr;height:calc(100vh - var(--topbar) - 56px)}
.chat-stream{display:flex;flex-direction:column;min-height:0}
.chat-feed{flex:1;overflow-y:auto;padding:8px 0 8px;scroll-behavior:smooth}
/* Диалог — центрированная колонка 780px (как в макете); отчёт шире (1180). */
.chat-msg{max-width:780px;margin:0 auto 16px}
.chat-msg.user{display:flex;flex-direction:column;align-items:flex-end}
.chat-msg .who{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);margin-bottom:6px;letter-spacing:.04em}
.chat-msg.user .who{text-align:right}
.chat-bubble{padding:14px 16px;border-radius:10px;font-size:14px;line-height:1.65;color:var(--ink)}
.chat-msg.user .chat-bubble{max-width:82%;background:var(--ink);color:var(--paper);border-radius:14px 14px 4px 14px;padding:12px 16px;font-size:14px;line-height:1.55}
.chat-msg.ai .chat-bubble{background:var(--surface);border:1px solid var(--hair);border-radius:10px 10px 10px 4px}
.chat-bubble strong{font-weight:600}
.chat-bubble em{font-style:italic;color:var(--ink-2)}
.chat-bubble ul{margin:6px 0 6px 16px}
.chat-bubble li{margin:2px 0}
.chat-bubble table{margin:8px 0;font-size:13px}
.chat-bubble .tool{display:inline-flex;align-items:center;gap:6px;margin:4px 0;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);padding:2px 8px;border:1px solid var(--hair);border-radius:4px;background:var(--paper);}
/* ── Композер (сегментированный, дизайн ИИ-аналитика) ── */
.chat-input-wrap{display:block;border:1px solid var(--hair-2);background:var(--surface);border-radius:14px;box-shadow:var(--shadow-2);overflow:hidden;transition:border-color .15s}
.composer-accent{height:2px;background:var(--accent)}
.chat-textarea{display:block;width:100%;resize:none;border:0;outline:none;background:transparent;font-size:14px;line-height:1.55;min-height:26px;max-height:160px;padding:16px 16px 6px;color:var(--ink)}
.chat-textarea::placeholder{color:var(--ink-4)}
.composer-bar{display:flex;align-items:center;gap:10px;padding:8px 12px 12px;flex-wrap:wrap}
.seg{display:inline-flex;padding:2px;background:var(--paper-2);border:1px solid var(--hair);border-radius:8px;gap:2px;position:relative}
.seg-ind{position:absolute;left:0;top:0;border-radius:5px;background:var(--surface);box-shadow:var(--shadow-1);
  transition:transform var(--dur-base) var(--ease-spring),width var(--dur-base) var(--ease-spring),opacity var(--dur-quick) var(--ease-out);
  pointer-events:none;z-index:0}
.seg--ind .seg-btn{position:relative;z-index:1}
.seg--ind .seg-btn.on{background:transparent;box-shadow:none}
.rv-chips{position:relative}
/* Со скользящей подложкой роль фона берёт на себя она: контейнер уходит на
   ступень назад, сами чипы становятся прозрачными, активный — просто
   темнее и плотнее по начертанию. */
.seg--ind.rv-chips{background:var(--paper-2)}
.seg--ind .rv-chip{position:relative;z-index:1;background:transparent;border-right-color:transparent}
.seg--ind .rv-chip:hover{background:transparent;color:var(--ink-2)}
.seg--ind .rv-chip.on{background:transparent;box-shadow:none;color:var(--ink);font-weight:600}
.seg-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:6px;font-size:12px;font-weight:500;color:var(--ink-3)}
.seg-btn.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg-btn:disabled{opacity:.6;cursor:default}
.seg-dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.composer-hint{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-4)}
.composer-kbd{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-4)}
.composer-send{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;font-size:13px;font-weight:500;background:var(--ink);color:var(--paper);transition:opacity .15s}
.composer-send.deep{background:var(--accent);color:#fff}
.composer-send:disabled{opacity:.45;cursor:not-allowed}
.composer-send svg{width:15px;height:15px}
/* Док композера: центрированная колонка 780px + градиент-подложка + сноска */
.composer-dock{flex:none;padding:14px 32px 16px;background:linear-gradient(to top,var(--paper) 60%,transparent)}
.composer-inner{max-width:780px;margin:0 auto}
.composer-note{text-align:center;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-4)}
/* ── Welcome (редакторский экран ИИ-аналитика) ── */
.ai-welcome{max-width:760px;margin:0 auto;padding:7vh 32px 40px}
.aw-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.aw-title{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.018em;margin:0 0 14px;color:var(--ink)}
.aw-lede{font-size:16px;line-height:1.6;color:var(--ink-2);max-width:54ch;margin:0 0 28px}
.aw-lede b{color:var(--ink);font-weight:600}
.aw-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.aw-card{text-align:left;padding:14px 16px;border:1px solid var(--hair);background:var(--surface);border-radius:10px;display:flex;flex-direction:column;gap:8px;transition:border-color .14s,transform .12s,box-shadow .14s}
.aw-card:hover{border-color:var(--ink-4);transform:translateY(-2px);box-shadow:var(--shadow-1)}
.aw-card-eb{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-4);text-transform:uppercase}
.aw-card-t{font-size:13px;line-height:1.45;color:var(--ink)}
.aw-conn{margin-top:24px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-4);line-height:1.6}
.aw-conn span{color:var(--ink-3)}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
.pending-row{display:flex;align-items:center;gap:10px;padding:10px 0}
.pending-label{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;color:var(--ink-3)}
.pending-sec{margin-left:6px;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.mk-export{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.mk-cov{margin-top:14px;padding:14px 18px}
.mk-cov>summary{cursor:pointer;display:flex;align-items:baseline;gap:10px;list-style:none}
.mk-cov>summary::-webkit-details-marker{display:none}
.mk-cov>summary::before{content:"›";color:var(--ink-3);transition:transform var(--dur-quick) var(--ease-out)}
.mk-cov[open]>summary::before{transform:rotate(90deg)}
.mk-cov-n{font-size:11px;color:var(--ink-3)}
.mk-cov-lede{font-size:12px;line-height:1.55;color:var(--ink-2);margin:10px 0 12px;max-width:62ch}
.mk-cov-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mk-cov-list>li{padding:10px 12px;border:1px solid var(--hair);border-radius:8px;background:var(--surface-2)}
.mk-cov-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mk-cov-tag{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--hair);color:var(--ink-3)}
.mk-cov-tag.has{color:var(--legal);border-color:color-mix(in oklch,var(--legal) 40%,transparent)}
.mk-cov-cnt{font-size:11px;color:var(--ink-3)}
.mk-cov-r{font-size:12px;line-height:1.5;color:var(--ink-2);margin-top:4px;max-width:70ch}
.mk-cov-need{font-size:11px;color:var(--ink-3);margin-top:3px}
.kb-full{white-space:pre-wrap;word-break:break-word;font:12px/1.65 var(--font-ui);color:var(--ink-1);max-height:52vh;overflow:auto;margin:0;padding:10px 12px;background:var(--surface-2);border:1px solid var(--hair);border-radius:8px}
.kb-full-bar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.kb-full-note{font-size:11px;color:var(--ink-3);flex:1;min-width:150px}
.mk-export-hint{font-size:11px;color:var(--ink-3)}
.pending-dots{display:inline-flex;gap:4px}
.pending-dots i{width:5px;height:5px;border-radius:50%;background:var(--ink-4);animation:blink 1.2s infinite ease-in-out}
.pending-dots i:nth-child(2){animation-delay:.15s}
.pending-dots i:nth-child(3){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){.pending-dots i{animation:none}}

/* ─── Deep Research mode — Editorial document layout ────────────────
   Senior design rule: документ — primary artefact, всё остальное служебное.
   Палитра: warm neutral + 1 accent + 2 status. Никаких градиентов, pulse,
   glow, emoji-decorations. Анимации только на user actions, ≤200ms.        */

/* Document column wrapper: TOC ⟂ Body ⟂ Sources rail на >=1180px */
.chat-bubble-deep{
  max-width:none;width:100%;background:transparent;border:0;padding:0;
  font-family:'Geist','Inter',system-ui,sans-serif;
  font-size:16px;line-height:1.7;color:var(--ink);
}
.chat-msg.ai:has(.chat-bubble-deep){max-width:1180px;margin-left:auto;margin-right:auto}
.chat-msg.ai:has(.chat-bubble-deep) .chat-bubble{
  background:transparent;border:0;border-radius:0;padding:0;
}

.dr-doc{
  display:grid;
  grid-template-columns:188px minmax(0,1fr) 268px;
  column-gap:32px;align-items:start;margin-top:8px;
}
@media(max-width:1180px){
  .dr-doc{grid-template-columns:1fr}
  .dr-doc-toc, .dr-doc-rail{display:none}
}
.dr-doc-toc{position:sticky;top:80px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
.dr-doc-rail{position:sticky;top:80px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
.dr-doc-main{min-width:0}

/* Editorial typography: Source Serif для headings, Geist для body */
.dr-doc-main h1{
  font-family:'Source Serif 4','Georgia',serif;
  font-weight:600;font-size:28px;line-height:1.22;
  letter-spacing:-.012em;color:var(--ink);
  margin:8px 0 6px;
}
.dr-doc-main h2{
  font-family:'Source Serif 4','Georgia',serif;
  font-weight:600;font-size:20px;line-height:1.3;letter-spacing:-.005em;
  color:var(--ink);margin:32px 0 8px;padding-top:14px;
  border-top:1px solid var(--hair);scroll-margin-top:80px;
}
.dr-doc-main h3{
  font-family:'Source Serif 4','Georgia',serif;
  font-weight:600;font-size:16px;line-height:1.35;
  margin:20px 0 6px;color:var(--ink);scroll-margin-top:80px;
}
.dr-doc-main p{margin:0 0 10px;color:var(--ink)}
.dr-doc-main ul,.dr-doc-main ol{margin:6px 0 14px 20px}
.dr-doc-main li{margin:2px 0;color:var(--ink)}
.dr-doc-main strong{font-weight:600;color:var(--ink)}
.dr-doc-main em{font-style:italic;color:var(--ink-2)}
.dr-doc-main table{
  width:100%;border-collapse:collapse;margin:12px 0 20px;
  font-size:14px;font-variant-numeric:tabular-nums;
}
.dr-doc-main thead th{
  font-family:'Geist','Inter',sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.005em;text-align:left;text-transform:none;
  padding:8px 10px;color:var(--ink-2);
  border-bottom:1.5px solid var(--ink);
}
.dr-doc-main tbody td{
  padding:8px 10px;border-bottom:1px solid var(--hair);
  vertical-align:top;color:var(--ink);
}
.dr-doc-main tbody tr:hover td{background:var(--paper-2)}
.dr-doc-main blockquote{
  margin:12px 0;padding:8px 16px;
  border-left:2px solid var(--ink);background:var(--paper-2);
  font-style:italic;color:var(--ink-2);
}
/* Markdown-ссылки в отчёте (отдельно от [N]-цитат) */
.dr-doc-main .md-link{color:var(--accent);text-decoration:underline;
  text-underline-offset:2px;word-break:break-word}
.dr-doc-main .md-link:hover{opacity:.82}

/* Citations — academic footnote-style superscript.
   Trust tier через типографику: weight + dotted underline + warn-tint */
.cite{
  font-family:'Source Serif 4','Georgia',serif;font-feature-settings:"sups";
  font-size:.78em;font-weight:500;color:var(--ink-2);
  text-decoration:none;line-height:1;
  padding:0 0px;margin:0 0px 0 0;
  vertical-align:baseline;cursor:pointer;
  transition:color .12s;
}
.cite:hover{color:var(--accent)}
.cite:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px;border-radius:4px}
.cite-anchor{color:var(--ink-3)}
.cite-t1{color:var(--ink-2)}
.cite-t2{color:var(--ink-2);border-bottom:.5px dotted var(--ink-3)}
.cite-t3{color:var(--warn)}
.cite-active{background:var(--accent-soft);border-radius:4px}

/* TOC — left rail */
.dr-toc{font-family:'Geist','Inter',sans-serif;border-right:1px solid var(--hair);padding-right:16px}
.dr-toc-h{
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;
  letter-spacing:.06em;color:var(--ink-3);
  padding:0 6px 8px;margin-bottom:6px;
}
.dr-toc ul{list-style:none;margin:0;padding:0}
.dr-toc-link{
  display:flex;gap:8px;padding:4px 6px 4px 14px;
  font-size:13px;color:var(--ink-2);line-height:1.4;
  border-radius:4px;cursor:pointer;border-left:1.5px solid transparent;
}
.dr-toc-link:hover{color:var(--ink);background:var(--paper-2)}
.dr-toc-link.active{color:var(--ink);border-left-color:var(--ink);font-weight:500}
.dr-toc-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-4);min-width:14px}

/* Sources rail — continuous list, bidirectional binding с цитатами */
.dr-rail{font-family:'Geist','Inter',sans-serif}
.dr-doc-rail{border-left:1px solid var(--hair);padding-left:16px}
.dr-rail-h{
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;
  letter-spacing:.06em;color:var(--ink-3);
  padding:0 0 10px;margin-bottom:8px;
  border-bottom:1px solid var(--hair);
  display:flex;align-items:center;gap:8px;
}
.dr-rail-failed{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--warn);
  padding:8px 4px 2px;border-top:1px solid var(--hair);margin-top:8px;line-height:1.5;}
.dr-rail-list{list-style:none;margin:0;padding:0}
.dr-rail-item{
  display:block;padding:8px 4px 8px 12px;
  border-bottom:1px solid var(--hair);border-left:2px solid transparent;
  cursor:pointer;text-decoration:none;color:var(--ink);
  transition:border-color .12s,background .12s;
}
.dr-rail-item:hover{background:var(--paper-2);border-left-color:var(--ink-3)}
.dr-rail-item.active{border-left-color:var(--ink);background:var(--paper-2)}
.dr-rail-num{
  font-family:'Source Serif 4','Georgia',serif;font-feature-settings:"sups";
  font-size:13px;font-weight:600;color:var(--ink);margin-right:6px;
}
.dr-rail-bank{font-size:13px;font-weight:500;color:var(--ink);line-height:1.3;margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.dr-rail-domain{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);
  margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;
}
.dr-rail-meta{
.dr-rail-dead{display:block;margin-top:2px;color:var(--warn);font-size:10px}
  display:flex;gap:6px;margin-top:4px;
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3);
}
.dr-trust-marks{font-family:'Source Serif 4',serif;letter-spacing:.5px;font-size:11px}
.dr-trust-marks-h{color:var(--pos)}
.dr-trust-marks-m{color:var(--ink-3)}
.dr-trust-marks-l{color:var(--warn)}

/* Citation tooltip */
.cite-tooltip{
  position:fixed;z-index:50;
  width:300px;padding:10px 12px;
  background:var(--surface);border:1px solid var(--ink);border-radius:6px;
  box-shadow:0 4px 16px oklch(0% 0 0 / .12);
  font-size:12px;line-height:1.45;color:var(--ink);pointer-events:none;
  opacity:0;transform:translateY(-2px);transition:opacity .15s,transform .15s;
}
.cite-tooltip.visible{opacity:1;transform:translateY(0)}
.cite-tooltip-num{
  font-family:'Source Serif 4',serif;font-weight:600;font-size:13px;color:var(--ink-2);
}
.cite-tooltip-bank{font-weight:600;margin:2px 0 4px}
.cite-tooltip-section{font-style:italic;color:var(--ink-3);font-size:11px;margin-bottom:4px}
.cite-tooltip-domain{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent)}
.cite-tooltip-meta{
  margin-top:6px;padding-top:6px;border-top:1px solid var(--hair);
  display:flex;gap:10px;font-size:11px;color:var(--ink-3);
}

/* Coverage — single line, минимально */
.dr-coverage{
  margin:8px 0 14px;padding:6px 12px;border-radius:4px;
  font-size:12px;line-height:1.5;font-family:'JetBrains Mono',monospace;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  border:1px solid var(--hair);background:var(--paper-2);color:var(--ink-2);
}
.dr-coverage strong{color:var(--ink);font-weight:600}
.dr-coverage-ok{border-color:color-mix(in oklab,var(--pos),transparent 70%)}
.dr-coverage-warn{
  border-color:color-mix(in oklab,var(--warn),transparent 60%);
  background:color-mix(in oklab,var(--warn),transparent 95%);
}

/* ─── Conflict badge — для критических расхождений в источниках.
   Цвет — единственное место где используем warn-tint, потому что это ровно
   тот сигнал ради которого аудитор пришёл (расхождение чисел). */
.dr-conflict{
  display:inline-flex;align-items:center;gap:6px;
  padding:0px 6px 2px;border-radius:4px;
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;
  background:color-mix(in oklab,var(--warn),transparent 88%);
  color:color-mix(in oklab,var(--warn),var(--ink) 30%);
  border:1px solid color-mix(in oklab,var(--warn),transparent 70%);
  vertical-align:middle;margin:0 4px;
}
.dr-conflict::before{
  content:"⚠";font-size:11px;line-height:1;
}
/* Когда conflict внутри строки md-таблицы — компактнее */
td .dr-conflict{padding:0 4px 0px;font-size:9px}

/* Block-level conflict notice (в начале раздела если несколько внутри) */
.dr-conflict-notice{
  margin:12px 0 4px;padding:8px 12px;
  border:1px solid color-mix(in oklab,var(--warn),transparent 75%);
  border-left:3px solid var(--warn);
  background:color-mix(in oklab,var(--warn),transparent 96%);
  font-size:13px;color:var(--ink-2);border-radius:4px;
}
.dr-conflict-notice b{color:var(--ink);font-weight:600}

/* ─── Verified facts counter (метаданные отчёта) ─────────────────────────── */
.dr-meta-row{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:8px 0 14px;border-bottom:1px solid var(--hair);
  margin-bottom:16px;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);
}
.dr-meta-pill{
  display:inline-flex;align-items:center;gap:6px;
}
.dr-meta-pill b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dr-meta-pill .dot{
  width:5px;height:5px;border-radius:50%;background:var(--ink-3);
}
.dr-meta-pill.ok  .dot{background:var(--pos)}
.dr-meta-pill.warn .dot{background:var(--warn)}

/* ─── Citation excerpt tooltip ─────────────────────────────────────────────
   При hover на [N] показываем реальный chunk-snippet. Реальная reproducibility
   для аудитора — он видит откуда фраза, без перехода на сайт. */
.cite-tooltip{
  position:fixed;z-index:50;max-width:420px;
  padding:12px 14px;border-radius:var(--r);
  background:var(--ink);color:var(--paper);
  border:1px solid var(--hair);
  font-family:'Geist','Inter',sans-serif;font-size:12px;line-height:1.55;
  box-shadow:var(--shadow-2);
  pointer-events:none;
  opacity:0;transform:translateY(2px);transition:opacity .12s,transform .12s;
}
.cite-tooltip.show{opacity:1;transform:translateY(0)}
.cite-tooltip-head{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:color-mix(in oklab,var(--paper),transparent 50%);
  margin-bottom:6px;display:flex;justify-content:space-between;gap:12px;
}
.cite-tooltip-body{
  white-space:pre-wrap;font-size:12px;
  color:color-mix(in oklab,var(--paper),transparent 12%);
}
.cite-tooltip-foot{
  margin-top:8px;padding-top:6px;
  border-top:1px solid color-mix(in oklab,var(--paper),transparent 80%);
  font-family:'JetBrains Mono',monospace;font-size:10px;
  color:color-mix(in oklab,var(--paper),transparent 40%);
}

/* ─── Document toolbar (с кнопкой PDF справа от заголовка отчёта) ───── */
.dr-doc-toolbar{
  display:flex;align-items:center;gap:14px;
  margin-bottom:8px;
}
.dr-doc-toolbar .who{flex:1}

/* ─── Premium PDF export button ───────────────────────────────────────────
   Минималистично, в editorial-стиле: тонкая рамка ink, JetBrains Mono для
   text-transform на «PDF», hover — invert (ink fill). Spinner — без неона. */
.btn-export{
  display:inline-flex;align-items:center;gap:6px;
  height:30px;padding:0 12px;border-radius:4px;
  background:transparent;color:var(--ink);
  border:1px solid var(--hair-2);
  font-family:'Geist','Inter',sans-serif;font-size:12px;font-weight:500;
  letter-spacing:-.005em;
  transition:background .15s,border-color .15s,color .15s;
  cursor:pointer;
}
.btn-export:hover:not(:disabled){
  background:var(--ink);color:var(--paper);border-color:var(--ink);
}
.btn-export:disabled{opacity:.6;cursor:wait}
.btn-export svg{flex-shrink:0;opacity:.85}
.btn-export-spinner{
  display:inline-block;width:11px;height:11px;border-radius:50%;
  border:1.5px solid var(--hair-2);border-top-color:var(--ink-2);
  animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── Pulse-маркер «идёт стадия» — используется ThinkingPanel, PendingDots
   и clarify-head. ──────────────────────────────────────────────────────── */
.dr-stage-pulse{
  width:7px;height:7px;border-radius:50%;background:var(--ink-2);
  flex-shrink:0;animation:pulse 1.4s ease-in-out infinite;
}
@keyframes drcaret{0%,100%{opacity:1}50%{opacity:0}}
.dr-think{
  margin:12px 0 14px;border:1px solid var(--hair);border-left:2px solid var(--ink-3);
  background:var(--paper-2);border-radius:var(--r);overflow:hidden;
}
.dr-think-active{border-left-color:var(--accent)}
.dr-think-head{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;user-select:none}
.dr-think-label{
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);flex:1;
}
.dr-think-badge{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.04em;
  color:var(--ink-4);border:1px solid var(--hair);border-radius:4px;padding:0px 6px;
}
.dr-think-toggle{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-4)}
.dr-think-body{
  padding:2px 12px 10px;max-height:180px;overflow-y:auto;
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.6;
  color:var(--ink-3);white-space:pre-wrap;word-break:break-word;
}
.dr-think-caret{
  display:inline-block;width:6px;height:13px;background:var(--accent);
  vertical-align:-2px;margin-left:0px;animation:drcaret 1s step-end infinite;
}
@media (prefers-reduced-motion:reduce){
  .dr-stage-pulse,.dr-think-caret{animation:none}
}
.dr-type-caret{display:inline-block;width:7px;height:14px;background:var(--accent);
  vertical-align:-2px;margin-left:2px;animation:drcaret 1s step-end infinite}
@keyframes drfadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.dr-fade-in{animation:drfadein .4s ease both}
@media (prefers-reduced-motion:reduce){
  .dr-type-caret,.dr-fade-in{animation:none}
}

/* ─── Deep Research console — единая timeline-консоль прогона (редизайн) ── */
.dr-con-wrap{max-width:820px;margin:0 auto;padding:6px 0 16px}
.dr-con{border:1px solid var(--hair);border-radius:14px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow-1)}
.dr-con-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--hair)}
.dr-con-pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.5s ease-in-out infinite}
.dr-con-title{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:14px;color:var(--ink)}
.dr-con-sub{font-size:12px;color:var(--ink-3)}
.dr-con-el{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dr-con-bar{height:2px;background:var(--hair)}
.dr-con-bar-fill{height:100%;background:var(--accent);transition:width .25s ease}
.dr-con-spine{padding:6px 16px 16px}
.dr-con-row{display:flex;gap:14px;align-items:stretch}
.dr-con-col{display:flex;flex-direction:column;align-items:center;width:18px;flex:none;padding-top:14px}
.dr-con-dot{width:11px;height:11px;border-radius:50%;border:1.5px solid;flex:none;display:grid;place-items:center;box-sizing:border-box}
.dr-con-conn{flex:1;width:1.5px;margin:4px 0 0;min-height:14px}
.dr-con-body{flex:1;min-width:0;padding:10px 0 12px;border-bottom:1px solid var(--hair)}
.dr-con-row:last-child .dr-con-body{border-bottom:0}
.dr-con-line{display:flex;align-items:baseline;gap:12px}
.dr-con-label{font-size:13px}
.dr-con-right{margin-left:auto;font-size:11px;text-align:right;white-space:nowrap}
.dr-con-agents{margin-top:10px;display:flex;flex-direction:column;gap:6px}
/* ── Консоль прогона: содержание шагов вместо спиннера ─────────────────
   Аудитор должен видеть рамку разбора и три стороны доказательства, а не
   «идёт анализ»: доверие к отчёту начинается с понимания, что искали. */
.dr-con-degraded{margin:10px 0 2px;padding:8px 12px;border:1px solid var(--warn,var(--warn));
  border-radius:6px;background:rgba(194,65,12,.06);color:var(--ink);font-size:12px;line-height:1.5}
.dr-con-hint{margin-left:10px;font-size:11px;font-weight:400;color:var(--ink-4)}
.dr-con-sub-h{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-4);margin-bottom:8px}
.dr-con-contract,.dr-con-queries{margin-top:10px;padding:10px 12px;border:1px solid var(--hair);
  border-radius:6px;background:var(--paper-2)}
.dr-con-chips{display:flex;flex-wrap:wrap;gap:6px}
.dr-con-chip{font-size:12px;padding:2px 8px;border-radius:14px;border:1px solid var(--hair-2);
  color:var(--ink-2);background:var(--paper);white-space:nowrap}
/* Наблюдаемая сторона и норма — разные источники правды, метим их цветом:
   по ним видно, будет ли в отчёте взгляд со стороны и нормативная рамка. */
.dr-con-chip.obs{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.dr-con-chip.reg{border-color:var(--ink-3);color:var(--ink);font-weight:500}
.dr-con-query{display:flex;align-items:baseline;gap:10px;padding:4px 0;font-size:12px;
  color:var(--ink-2);border-bottom:1px solid var(--hair)}
.dr-con-query:last-of-type{border-bottom:0}
.dr-con-q-txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-con-q-site{font-size:10px;color:var(--accent);flex:none;padding:0px 6px;
  border-radius:4px;background:var(--accent-soft)}
.dr-con-more{margin-top:6px;font-size:11px;color:var(--ink-4)}
.dr-con-stances{margin-top:10px;display:flex;gap:8px}
.dr-con-stance{flex:1;padding:8px 10px;border:1px solid var(--hair);border-radius:6px;
  background:var(--paper-2);display:flex;flex-direction:column;gap:2px}
.dr-con-stance-n{font-size:18px;font-weight:600;color:var(--ink);line-height:1.1}
.dr-con-stance-l{font-size:11px;color:var(--ink-4)}
.dr-con-stance.observed .dr-con-stance-n{color:var(--accent)}
.dr-con-stance.regulatory{border-color:var(--ink-3)}
.dr-con-agent{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--hair);border-radius:8px;background:var(--paper-2)}
.dr-con-agent-dot{width:7px;height:7px;border-radius:50%;flex:none}
.dr-con-agent-name{flex:1;min-width:0;font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-con-agent-st{font-size:11px;flex:none;white-space:nowrap}
.dr-con-outline{margin-top:10px;padding:10px 12px;border:1px solid var(--hair);border-radius:6px;background:var(--paper-2)}
.dr-con-outline-h{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);margin-bottom:8px}
.dr-con-outline-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.dr-con-outline-item{font-size:12px;color:var(--ink-2);display:flex;gap:8px;align-items:baseline}
.dr-con-outline-n{font-size:10px;color:var(--ink-4);flex:none}
.dr-con-gaps{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.dr-con-gap{display:flex;align-items:baseline;gap:10px;padding:6px 10px;border:1px dashed var(--hair-2);border-radius:8px;background:var(--paper-2)}
.dr-con-gap-i{font-size:12px;color:var(--accent);flex:none}
.dr-con-gap-w{flex:1;min-width:0;font-size:12px;color:var(--ink)}
.dr-con-gap-q{font-size:10px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
/* размышления модели внутри спайна — ужать отступы переиспользуемого ThinkingPanel */
.dr-con-body .dr-think{margin:10px 0 0}
@media (prefers-reduced-motion:reduce){.dr-con-pulse,.dr-con-agent-dot{animation:none}}

/* Сводка завершённого прогона (collapsed bar над отчётом) */
.dr-summary-bar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:10px 16px;border:1px solid var(--hair);border-radius:8px;background:var(--paper-2);margin-bottom:24px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3)}
.dr-summary-bar b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dr-summary-ok{display:inline-flex;align-items:center;gap:6px;color:var(--pos)}

/* Thread head «Новый запрос» */
.al-thread-head{display:flex;align-items:center;max-width:1180px;margin:0 auto;padding:2px 0 12px}
.al-newq{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--hair-2);color:var(--ink-2);font-size:12px;font-weight:500;background:none;cursor:pointer;transition:border-color .12s,color .12s}
.al-newq:hover{border-color:var(--ink-4);color:var(--ink)}

/* Нижний running-бар (прогон Deep Research) */
.al-runbar{flex:none;border-top:1px solid var(--hair);background:var(--paper);padding:12px 4px;display:flex;align-items:center;gap:14px}
.al-runbar-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.4s ease-in-out infinite}
.al-runbar-text{font-size:13px;color:var(--ink-2)}
.al-runbar-el{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.al-runbar-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--hair-2);color:var(--ink-2);font-size:12px;font-weight:500;background:none;cursor:pointer;transition:border-color .12s,color .12s}
.al-runbar-btn:hover{border-color:var(--ink-4);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.al-runbar-dot{animation:none}}

/* ─── Quick — редизайн ответа ИИ (голый текст + tool-бокс + источники + апселл) ── */
.quick-msg{max-width:780px}
.quick-msg .who{margin-bottom:8px}
.quick-tools{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:6px 10px;border:1px solid var(--hair);border-radius:6px;background:var(--paper-2);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3)}
.quick-tool{display:inline-flex;align-items:center;gap:8px}
.quick-tool-dot{width:5px;height:5px;border-radius:50%;background:var(--ink-4);flex:none}
.chat-msg.ai .quick-answer.chat-bubble{padding:0;background:none;border:0;border-radius:0;font-size:14px;line-height:1.7;color:var(--ink)}
.quick-sources{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.quick-src{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--hair);border-radius:8px;background:var(--surface);text-decoration:none;color:var(--ink);transition:border-color .12s}
.quick-src:hover{border-color:var(--ink-4)}
.quick-src-n{font-family:'Source Serif 4',serif;font-weight:600;font-size:12px;color:var(--ink-2)}
.quick-src-bank{font-size:12px;font-weight:500;color:var(--ink)}
.quick-src-dom{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3)}
.quick-upsell{margin-top:16px;padding:12px 14px;border:1px solid var(--hair);border-left:2px solid var(--accent);border-radius:8px;background:var(--paper-2);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.quick-upsell-t{font-size:13px;color:var(--ink-2);flex:1;min-width:200px}
.quick-upsell-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:6px;background:var(--accent);color:#fff;font-size:12px;font-weight:500;border:0;cursor:pointer}
.quick-upsell-btn svg{width:14px;height:14px}

/* ── Модуль asking — clarification-воронка ── */
.clarify-card{border:1px solid var(--hair);border-radius:var(--r);background:var(--surface);padding:16px 16px}
.clarify-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.clarify-x{margin-left:auto;background:none;border:0;color:var(--ink-4);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:4px;line-height:1}
.clarify-x:hover{color:var(--ink-2)}
.clarify-sub{color:var(--ink-3);font-size:12px;margin-bottom:14px}
.clarify-q{margin-bottom:14px}
.clarify-q-t{font-size:14px;font-weight:500;color:var(--ink);margin-bottom:8px}
.clarify-chips{display:flex;flex-wrap:wrap;gap:8px}
.clarify-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--hair);
  border-radius:8px;background:var(--paper-2);color:var(--ink-2);font-size:13px;cursor:pointer;user-select:none;
  transition:border-color .12s,background .12s,color .12s}
.clarify-chip:hover{border-color:var(--ink-4);color:var(--ink)}
.clarify-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.clarify-box{width:14px;height:14px;border:1.5px solid var(--ink-4);display:grid;place-items:center;flex:none}
.clarify-chip.single .clarify-box{border-radius:50%}
.clarify-chip.multi .clarify-box{border-radius:4px}
.clarify-chip.on .clarify-box{border-color:var(--accent);background:var(--accent);color:var(--paper)}
.clarify-box svg{width:10px;height:10px}
.clarify-chip.dashed{border-style:dashed;border-color:var(--ink-4);background:none;color:var(--ink-3)}
.clarify-chip.dashed.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.clarify-chip.dashed .clarify-box{display:none}
.clarify-rec{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px}
.clarify-input{width:100%;background:var(--paper-2);border:1px solid var(--hair);border-radius:6px;
  padding:8px 10px;color:var(--ink);font-size:13px;font-family:inherit}
.clarify-input:focus{outline:none;border-color:var(--accent)}
.clarify-foot{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--hair)}
.clarify-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-4)}
.clarify-skip-btn{margin-left:auto;background:none;border:1px solid var(--hair);color:var(--ink-3);
  padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.clarify-skip-btn:hover{border-color:var(--ink-4);color:var(--ink-2)}
.clarify-go{background:var(--accent);border:1px solid var(--accent);color:var(--paper);font-weight:500;
  padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px}
.clarify-go:hover{filter:brightness(1.08)}

/* ─── Document footer — дублирующая PDF-кнопка после содержания отчёта ─
   Премиум: тонкая полоса разделителя, кнопка чуть крупнее (как call-to-action
   в конце статьи), справа — короткая подсказка про что внутри PDF. */
.dr-doc-footer{
  margin:32px 0 8px;padding:16px 0 4px;
  border-top:1px solid var(--hair);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.dr-doc-footer .btn-export{
  height:34px;padding:0 16px;font-size:13px;
  background:var(--ink);color:var(--paper);border-color:var(--ink);
}
.dr-doc-footer .btn-export:hover:not(:disabled){
  background:transparent;color:var(--ink);border-color:var(--ink);
}
.dr-doc-footer-hint{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;line-height:1.4;
}
.dr-coverage-warning{flex-basis:100%;font-family:'Geist','Inter',sans-serif;color:var(--warn);font-size:12px}

/* Verification — quiet, reserved для актуальных flag'ов */
.dr-verify{
  margin:14px 0;padding:10px 14px;border-radius:4px;
  font-size:13px;line-height:1.5;font-family:'Geist','Inter',sans-serif;
  border:1px solid var(--hair);
}
.dr-verify-ok{
  border-color:color-mix(in oklab,var(--pos),transparent 70%);
  background:color-mix(in oklab,var(--pos),transparent 95%);color:#1f6b3a;
  display:flex;align-items:center;gap:8px;
}
.dr-verify-warn{
  border-color:color-mix(in oklab,var(--warn),transparent 60%);
  background:color-mix(in oklab,var(--warn),transparent 94%);color:var(--warn-ink);
}
/* Пробел в ответе — нейтрально-серьёзный, не «ошибка» и не «всё хорошо»:
   отчёт корректен, но части вопроса в источниках не нашлось. */
.dr-verify-gap{
  border-color:color-mix(in oklab,var(--ink-2),transparent 72%);
  background:color-mix(in oklab,var(--ink-2),transparent 96%);color:var(--ink-1);
}
.dr-verify-foot{margin-top:6px;font-size:12px;color:var(--ink-3)}
.claim-flag{
  position:absolute;z-index:40;padding:4px 10px;border-radius:4px;
  font-family:'Geist','Inter',sans-serif;font-size:12px;font-weight:600;
  background:var(--warn);color:#fff;border:none;cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.18);white-space:nowrap;
}
.claim-flag:hover{filter:brightness(1.07)}
.dr-verify-head{font-weight:600;margin-bottom:6px}
.dr-verify-list{margin:0;padding-left:20px;font-size:12px}
.dr-verify-list li{margin-bottom:2px}
.dr-verify-list strong{font-family:'Source Serif 4',serif;font-weight:500}

/* Ranking — v2 first-class артефакт */
.dr-ranking{
  margin:14px 0;padding:12px 16px;border-radius:4px;
  border:1px solid var(--hair);
  background:color-mix(in oklab,var(--accent),transparent 96%);
  font-family:'Geist','Inter',sans-serif;font-size:13px;
}
.dr-ranking-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.dr-ranking-title{font-weight:600}
.dr-ranking-criterion{color:var(--ink-3);font-size:12px}
.dr-ranking-list{margin:0;padding:0;list-style:none}
.dr-ranking-row{
  display:flex;gap:12px;align-items:flex-start;
  padding:8px 0;border-top:1px solid var(--hair);
}
.dr-ranking-row:first-child{border-top:0}
.dr-ranking-rank{
  flex:0 0 auto;min-width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:12px;color:var(--ink-2);
  background:color-mix(in oklab,var(--accent),transparent 88%);
}
.dr-ranking-row:first-child .dr-ranking-rank{
  background:var(--accent);color:#fff;
}
.dr-ranking-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.dr-ranking-subject{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dr-ranking-score{font-weight:400;color:var(--ink-3);font-size:12px}
.dr-ranking-dg{font-size:11px;color:var(--warn);font-style:italic}
.dr-ranking-gap .dr-ranking-subject{color:var(--ink-3)}
.dr-ranking-rationale{font-family:'Source Serif 4',serif;font-size:13px;color:var(--ink)}

/* Insights — v2 first-class артефакт */
.dr-insights{
  margin:14px 0;padding:12px 16px;border-radius:4px;
  border:1px solid var(--hair);
  background:color-mix(in oklab,var(--accent),transparent 96%);
  font-family:'Geist','Inter',sans-serif;font-size:13px;
}
.dr-insights-head{margin-bottom:8px}
.dr-insights-title{font-weight:600}
.dr-insights-list{margin:0;padding:0;list-style:none}
.dr-insight{
  padding:8px 0;border-top:1px solid var(--hair);
  display:flex;flex-direction:column;gap:2px;
}
.dr-insight:first-child{border-top:0}
.dr-insight-headline{font-weight:600;font-family:'Source Serif 4',serif}
.dr-insight-explain{font-family:'Source Serif 4',serif;color:var(--ink);font-size:13px}
.dr-insight-impact{font-size:12px;color:var(--ink-3)}
.dr-insight-impact-label{font-weight:600;color:var(--ink-2)}

/* Charts — editorial, без shadow / borders cards */
.dr-charts-wrap{
  margin:24px 0;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px;
}
.dr-chart{padding:0;background:transparent;border:0;border-top:1px solid var(--hair);padding-top:14px}
.dr-chart-insight{font-family:'Source Serif 4',Georgia,serif;font-style:italic;font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.5;max-width:64ch;}
.dr-chart-inline{margin:6px 0 16px;}
/* ─── 3 сентября: перекидной календарь, раз в год ─── */
.s3-strip{display:flex;align-items:center;gap:12px;padding:8px 12px;margin:0 0 14px;border:1px solid var(--hair);border-radius:8px;background:var(--paper-2)}
.s3-cal{position:relative;width:34px;height:40px;flex:0 0 auto;padding:0;border:0;background:none;cursor:pointer;perspective:220px}
.s3-rings{position:absolute;top:-2px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:3}
.s3-rings i{display:block;width:4px;height:8px;border:1.5px solid var(--ink-3);border-radius:4px;background:var(--paper)}
.s3-leaf{position:absolute;inset:4px 0 0;display:flex;align-items:center;justify-content:center;border:1px solid var(--hair-2);border-radius:4px;background:var(--surface);box-shadow:var(--shadow-1);transform-origin:top center;backface-visibility:hidden;transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.s3-leaf b{font-size:20px;font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.s3-leaf-old{z-index:2}
.s3-leaf-new{z-index:1;transform:rotateX(90deg)}
.s3-leaf-new b{color:var(--accent)}
.s3-strip.flipped .s3-leaf-old{transform:rotateX(-92deg)}
.s3-strip.flipped .s3-leaf-new{transform:rotateX(0);z-index:2}
.s3-cal:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.s3-tip{position:absolute;left:-2px;top:calc(100% + 7px);transform:translateY(-3px);white-space:nowrap;background:var(--ink);color:var(--paper);font-size:11px;line-height:1;padding:4px 8px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .14s ease,transform .14s ease;z-index:5}
.s3-tip::before{content:'';position:absolute;left:14px;top:-3px;width:6px;height:6px;background:var(--ink);transform:rotate(45deg)}
.s3-cal:hover .s3-tip,.s3-cal:focus-visible .s3-tip,.s3-portrait:hover .s3-tip,.s3-portrait:focus-visible .s3-tip{opacity:1;transform:translateY(0)}
.s3-portrait:hover .s3-mouth{transform:scaleY(1.6)}
.s3-portrait{position:relative;overflow:visible;width:34px;height:34px;flex:0 0 auto;padding:0;border:0;background:none;cursor:pointer;line-height:0}
.s3-face{width:34px;height:34px;shape-rendering:crispEdges;image-rendering:pixelated}
.s3-face .s3-mouth{transition:transform .18s ease;transform-origin:center}
.s3-face.sing .s3-mouth{transform:scaleY(1.9) translateY(.15px)}
.s3-berry{position:absolute;left:50%;top:60%;width:4px;height:4px;border-radius:50%;background:var(--accent);animation:s3-fall 1.4s ease-in forwards}
@keyframes s3-fall{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(-50%,26px) scale(1);opacity:0}}
.s3-line{flex:1;min-width:0;font-size:12px;line-height:1.35;color:var(--ink-2)}
.s3-line b{color:var(--ink);font-weight:600}
.s3-count{color:var(--ink-3)}
.s3-hide{flex:0 0 auto;border:0;background:none;color:var(--ink-4);font-size:16px;line-height:1;cursor:pointer;padding:2px 4px}
.s3-hide:hover{color:var(--ink-2)}
@media(max-width:760px){.s3-line span{display:none}.s3-line b{font-size:13px}}
@media(prefers-reduced-motion:reduce){.s3-leaf{transition:none}.s3-berry{animation-duration:.01s}}
.dr-viz{margin:16px 0 20px;max-width:100%;overflow:hidden;position:relative;contain:layout paint;isolation:isolate;font-family:'Geist',system-ui,sans-serif;font-size:13px;line-height:1.35;color:var(--ink)}
.dr-viz .viz{width:100%;max-width:100%}
.dr-viz svg{max-width:100%;height:auto;max-height:600px}
.dr-viz svg text:not([fill]){fill:var(--ink)}
.dr-viz-rejected{color:var(--ink-3);font-style:italic}
@media(max-width:640px){.dr-viz [style*="grid-template-columns"]{display:flex!important;flex-wrap:wrap!important}}
.dr-viz table{border-collapse:collapse;max-width:100%}
.dr-viz .viz-cite{font-size:.7em;vertical-align:super;color:var(--ink-3);margin-left:0px;cursor:pointer}
.dr-viz-pending{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px dashed var(--hair-2);border-radius:6px;color:var(--ink-3);font-size:12px}
.dr-viz-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:dr-viz-pulse 1.2s ease-in-out infinite}
@keyframes dr-viz-pulse{0%,100%{opacity:.25}50%{opacity:1}}
.dr-chart > canvas{max-height:240px}
.dr-chart-cites{
  margin-top:8px;font-size:11px;color:var(--ink-3);
  font-family:'Geist','Inter',sans-serif;font-style:italic;
}
.dr-chart-cites .cite{font-size:.85em}
.dr-chart-inline{margin:28px 0;padding:16px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.dr-chart-inline .dr-chart{border-top:0;padding-top:0}

/* Deep toggle — outline, no gradient */
.deep-toggle{
  display:inline-flex;align-items:center;gap:6px;
  padding:0 12px;height:34px;
  border:1px solid var(--hair-2);border-radius:6px;
  background:var(--surface);font-size:12px;color:var(--ink-2);
  cursor:pointer;font-weight:500;letter-spacing:-.005em;
  white-space:nowrap;transition:border-color .12s,color .12s,background .12s;
  font-family:'Geist','Inter',sans-serif;
}
.deep-toggle::before{
  content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--ink-4);transition:background .12s;
}
.deep-toggle:hover{border-color:var(--ink-3);color:var(--ink)}
.deep-toggle:disabled{opacity:.5;cursor:not-allowed}
.deep-toggle-on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.deep-toggle-on::before{background:var(--paper)}

/* Keyboard shortcuts overlay */
.kbd-help{
  position:fixed;inset:0;z-index:200;background:oklch(0% 0 0 / .35);
  display:grid;place-items:center;animation:fade-in .18s ease-out;
}
.kbd-help-card{
  background:var(--surface);border:1px solid var(--hair);border-radius:8px;
  width:520px;max-width:calc(100% - 32px);padding:24px 24px;
  box-shadow:0 10px 30px oklch(0% 0 0 / .15);
  font-family:'Geist','Inter',sans-serif;
}
.kbd-help-card h3{font-family:'Source Serif 4',serif;font-weight:600;font-size:18px;margin-bottom:14px}
.kbd-help-row{
  display:grid;grid-template-columns:1fr auto;align-items:baseline;
  padding:4px 0;border-bottom:1px dotted var(--hair);font-size:13px;
}
.kbd-help-row:last-child{border-bottom:0}
.kbd-help-keys{font-family:'JetBrains Mono',monospace;font-size:11px;display:inline-flex;gap:4px}
.kbd-help-keys kbd{
  padding:0px 6px;border:1px solid var(--hair-2);border-radius:4px;
  background:var(--paper-2);color:var(--ink-2);font-family:inherit;
  box-shadow:0 1px 0 var(--hair-2);
}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

/* Print: clean PDF output */
@media print{
  .topbar,.rail,.chat-input-wrap,.deep-toggle,.dr-doc-toc,
  .typing,.tools-tl,.kbd-help,.al-thread-head,.al-runbar,.dr-con-wrap,
  .quick-tools,.quick-upsell{display:none !important}
  body{background:#fff;color:#000;font-size:11pt}
  .chat-feed{padding:0}
  .chat-msg{max-width:100% !important;page-break-inside:avoid;margin:0 0 6mm}
  .chat-bubble,.chat-bubble-deep{max-width:100% !important}
  .chat-msg.user,.chat-msg .who{display:none}
  .dr-doc{display:block}
  .dr-doc-rail{
    display:block !important;position:static;border-left:0;padding-left:0;
    margin-top:10mm;page-break-before:always;border-top:1.5px solid #000;padding-top:6mm;
  }
  .dr-doc-rail::before{
    content:"References";display:block;
    font-family:'Source Serif 4',serif;font-weight:600;font-size:14pt;margin-bottom:4mm;
  }
  .dr-rail-h{display:none}
  .dr-rail-item{border-left:0;padding:2mm 0;break-inside:avoid}
  .dr-rail-item:hover,.dr-rail-item.active{background:transparent}
  .cite{color:#000 !important;font-weight:600}
  .cite-tooltip{display:none}
  .dr-doc-main h2{break-after:avoid}
  .dr-doc-main table{break-inside:avoid}
}

/* ─── База знаний ────────────────────────────────────────────────────── */
.kb-bar{position:sticky;top:0;z-index:5;padding:10px 0 12px;margin-bottom:6px;
  background:linear-gradient(var(--paper) 78%,transparent);}
.kb-input-wrap{position:relative;display:flex;align-items:center}
.kb-input{width:100%;padding:14px 44px 14px 16px;border:1px solid var(--hair-2);
  border-radius:10px;background:var(--surface);font-size:14px;color:var(--ink);
  transition:border-color .15s,box-shadow .15s}
.kb-input::placeholder{color:var(--ink-4)}
.kb-input:focus{outline:none;border-color:var(--ink);
  box-shadow:0 0 0 3px color-mix(in oklab,var(--ink),transparent 90%)}
.kb-spin{position:absolute;right:16px;width:13px;height:13px;border-radius:50%;
  border:2px solid var(--hair-2);border-top-color:var(--accent);
  animation:kbspin .7s linear infinite}
@keyframes kbspin{to{transform:rotate(360deg)}}
.kb-clear{position:absolute;right:12px;border:0;background:none;cursor:pointer;
  color:var(--ink-4);font-size:20px;line-height:1;padding:2px 6px;border-radius:4px}
.kb-clear:hover{color:var(--ink);background:var(--paper-2)}
.kb-filters{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.kb-sel{padding:6px 10px;border:1px solid var(--hair);border-radius:6px;
  background:var(--surface);font-size:12px;color:var(--ink-2);cursor:pointer;
  font-family:'JetBrains Mono',monospace}
.kb-sel:focus{outline:none;border-color:var(--ink-3)}

.kb-summary{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-4);
  padding:2px 2px 12px;display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.kb-summary b{color:var(--ink-2)}
.kb-modes{padding-left:14px;border-left:1px solid var(--hair)}

.kb-doc{background:var(--surface);border:1px solid var(--hair);border-radius:10px;
  padding:14px 16px;margin-bottom:10px;transition:border-color .15s}
.kb-doc:hover{border-color:var(--hair-2)}
.kb-doc-head{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.kb-doc-title{font-size:14px;line-height:1.4;font-weight:500}
.kb-doc-title a{color:var(--ink);text-decoration:none}
.kb-doc-title a:hover{text-decoration:underline;text-underline-offset:3px}
.kb-type{margin-left:8px;font-family:'JetBrains Mono',monospace;font-size:9px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--ink-4);
  border:1px solid var(--hair-2);border-radius:4px;padding:0px 4px;vertical-align:2px}
.kb-doc-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-4)}
.kb-doc-meta .kb-bank{color:var(--ink-2)}
.kb-doc-meta .kb-dom{color:var(--accent)}
.kb-hits{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.kb-hit{border-left:2px solid var(--hair-2);padding-left:10px}
.kb-crumbs{font-size:10px;color:var(--ink-4);font-style:italic;margin-bottom:2px}
.kb-snip{font-size:13px;line-height:1.62;color:var(--ink-2);margin:0}
.kb-hl{background:color-mix(in oklab,var(--accent),transparent 82%);
  color:var(--ink);border-radius:4px;padding:0 0px;font-weight:500}
.kb-via{display:inline-block;margin-top:4px;font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:.04em;color:var(--ink-4)}

.kb-empty{padding:20px 24px;border:1px dashed var(--hair-2);border-radius:10px;
  font-size:13px;line-height:1.65;color:var(--ink-2);background:var(--surface)}
.kb-empty.neg{border-color:color-mix(in oklab,var(--neg),transparent 60%);color:var(--neg)}
.kb-empty b{color:var(--ink)}
.kb-empty p{margin:8px 0 6px}
.kb-empty ul{margin:0;padding-left:16px}
.kb-empty li{margin-bottom:4px}

.kb-what{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin:6px 0 16px}
.kb-what-k{background:var(--surface);border:1px solid var(--hair);border-radius:10px;
  padding:14px 16px}
.kb-what-k b{display:block;font-family:'Source Serif 4',Georgia,serif;font-size:28px;
  line-height:1;color:var(--ink);font-feature-settings:"tnum"}
.kb-what-k span{display:block;margin-top:6px;font-size:11px;color:var(--ink-4);line-height:1.4}
.kb-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.kb-grid2{grid-template-columns:1fr}}
.kb-panel{padding:16px 16px}
.kb-kind{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:12px}
.kb-kind-n{width:150px;flex:none;color:var(--ink-2)}
.kb-kind-bar{flex:1;height:6px;background:var(--paper-2);border-radius:4px;overflow:hidden}
.kb-kind-bar i{display:block;height:100%;border-radius:4px;
  background:color-mix(in oklab,var(--accent),transparent 45%)}
.kb-kind-v{width:44px;text-align:right;font-size:11px;color:var(--ink-3)}
.kb-banks{display:flex;flex-wrap:wrap;gap:6px}
.kb-bank-chip{border:1px solid var(--hair);background:var(--paper-2);border-radius:14px;
  padding:4px 10px;font-size:12px;color:var(--ink-2);cursor:pointer;
  display:inline-flex;align-items:baseline;gap:6px;transition:border-color .15s}
.kb-bank-chip:hover{border-color:var(--ink-3);color:var(--ink)}
.kb-bank-chip i{font-style:normal;font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--ink-4)}
.kb-hint{margin-top:16px;padding:12px 16px;border:1px solid var(--hair);
  border-radius:10px;font-size:12px;line-height:1.6;color:var(--ink-3);
  background:var(--paper-2)}
.kb-hint b{color:var(--ink-2)}
.kb-tech{margin-top:16px;padding:14px 16px}
.kb-tech summary{cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4)}
.kb-tech summary:hover{color:var(--ink-2)}
.kb-tech-kv{display:grid;grid-template-columns:auto auto;gap:6px 20px;
  justify-content:start;font-size:12px}
.kb-tech-kv span{color:var(--ink-4)}
.kb-tech-kv b{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-2)}

/* ─── Карточка документа, история, дело, карта покрытия ──────────────── */
.kb-doc-a{border:0;background:none;padding:0;text-align:left;cursor:pointer;
  font:inherit;color:var(--ink);}
.kb-doc-a:hover{text-decoration:underline;text-underline-offset:3px;}

.kb-card-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-4);
  padding-bottom:12px;border-bottom:1px solid var(--hair);}
.kb-card-meta .kb-bank{color:var(--ink-2);}
.kb-card-topics{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;}
.kb-topic{font-size:11px;color:var(--ink-3);background:var(--paper-2);
  border:1px solid var(--hair);border-radius:14px;padding:2px 10px;}
.kb-card-kv{display:grid;grid-template-columns:auto auto;gap:6px 20px;
  justify-content:start;margin:14px 0;font-size:12px;}
.kb-card-kv span{color:var(--ink-4);}
.kb-card-kv b{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-2);}
.kb-card-open{display:inline-flex;margin:4px 0 16px;}

.kb-origin{margin:12px 0;padding:10px 12px;border-radius:8px;
  background:var(--paper-2);border:1px solid var(--hair);font-size:12px;}
.kb-origin-row+.kb-origin-row{margin-top:8px;padding-top:8px;border-top:1px solid var(--hair);}
.kb-origin-row b{color:var(--ink-2);font-weight:500;}
.kb-origin-q{color:var(--ink-3);font-style:italic;margin-top:2px;line-height:1.5;}
.kb-origin-row a{color:var(--accent);font-size:11px;}
.kb-origin-skip{display:inline-block;margin-top:2px;font-size:11px;color:var(--neg);}

.kb-tabs{display:flex;gap:4px;border-bottom:1px solid var(--hair);margin:6px 0 14px;}
.kb-tab{border:0;background:none;cursor:pointer;padding:8px 12px;font-size:12px;
  color:var(--ink-4);border-bottom:2px solid transparent;margin-bottom:-0px;
  display:inline-flex;align-items:center;gap:6px;}
.kb-tab:hover{color:var(--ink-2);}
.kb-tab.on{color:var(--ink);border-bottom-color:var(--accent);}
.kb-tab i{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:9px;
  background:var(--paper-2);border-radius:8px;padding:0px 6px;color:var(--ink-4);}
.kb-preview{display:flex;flex-direction:column;gap:10px;}

.kb-norev{font-size:12px;line-height:1.6;color:var(--ink-3);padding:14px 16px;
  border:1px dashed var(--hair-2);border-radius:8px;}
.kb-rev-item{position:relative;padding:0 0 14px 20px;border-left:1px solid var(--hair);}
.kb-rev-item:last-child{border-left-color:transparent;}
.kb-rev-dot{position:absolute;left:-4.5px;top:5px;width:8px;height:8px;border-radius:50%;
  background:var(--surface);border:2px solid var(--hair-2);}
.kb-rev-item:first-child .kb-rev-dot{border-color:var(--accent);}
.kb-rev-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:12px;}
.kb-rev-top b{font-weight:500;color:var(--ink);}
.kb-rev-top .mono{font-size:10px;color:var(--ink-4);}
.kb-rev-d{font-family:'JetBrains Mono',monospace;font-size:10px;}
.kb-rev-d.pos{color:var(--pos);} .kb-rev-d.neg{color:var(--neg);}
.kb-rev-cur{font-size:10px;color:var(--accent);border:1px solid var(--accent);
  border-radius:4px;padding:0 4px;}
.kb-rev-body>button{margin-top:4px;}
.kb-diff{margin:8px 0 2px;padding:10px 12px;border-radius:8px;background:var(--paper-2);
  border:1px solid var(--hair);}
.kb-diff-sum{font-size:10px;color:var(--ink-4);margin-bottom:8px;}
.kb-d-in,.kb-d-out{font-size:12px;line-height:1.55;margin:0 0 4px;padding:4px 8px;
  border-radius:4px;border-left:2px solid;}
.kb-d-in{background:color-mix(in oklab,var(--pos),transparent 92%);
  border-left-color:var(--pos);color:var(--ink-2);}
.kb-d-out{background:color-mix(in oklab,var(--neg),transparent 92%);
  border-left-color:var(--neg);color:var(--ink-3);}

.kb-case-pick .input{width:100%;}
.kb-case-note span{display:block;font-size:11px;color:var(--ink-4);margin-bottom:4px;}
.kb-case-note i{font-style:normal;opacity:.65;}
.kb-case-list{display:flex;flex-direction:column;gap:6px;margin:12px 0;}
.kb-case-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;
  border:1px solid var(--hair);background:var(--surface);border-radius:8px;
  padding:8px 12px;font-size:12px;color:var(--ink-2);cursor:pointer;text-align:left;}
.kb-case-btn:hover{border-color:var(--ink-3);color:var(--ink);}
.kb-case-btn i{font-style:normal;font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--ink-4);}
.kb-case-new{display:flex;gap:8px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--hair);}
.kb-case-new .input{flex:1;}
.kb-attached{padding:14px 16px;border-radius:8px;font-size:13px;color:var(--ink-2);
  background:color-mix(in oklab,var(--pos),transparent 92%);
  border:1px solid color-mix(in oklab,var(--pos),transparent 70%);}
.kb-attached a{color:var(--accent);}
.kb-case-row{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;
  border:1px solid var(--hair);background:var(--surface);border-radius:8px;
  padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.kb-case-row:hover{border-color:var(--ink-3);}
.kb-case-row-t{font-size:13px;color:var(--ink);}
.kb-case-acts{margin-bottom:14px;}
.kb-case-item{padding:10px 0;border-bottom:1px solid var(--hair);}
.kb-case-it-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.kb-case-it-t{border:0;background:none;padding:0;cursor:pointer;text-align:left;
  font:inherit;font-size:13px;color:var(--ink);}
.kb-case-it-t:hover{text-decoration:underline;text-underline-offset:3px;}
.kb-case-x{border:0;background:none;cursor:pointer;color:var(--ink-4);font-size:13px;
  padding:2px 6px;border-radius:4px;}
.kb-case-x:hover{color:var(--neg);background:var(--paper-2);}
.kb-case-note-t{font-size:12px;color:var(--ink-3);font-style:italic;margin:4px 0 0;}

.kb-heat-wrap{overflow-x:auto;}
.kb-heat{border-collapse:separate;border-spacing:2px;font-size:11px;}
.kb-heat th{font-weight:400;color:var(--ink-4);font-size:10px;text-align:left;
  padding:2px 6px;white-space:nowrap;}
.kb-heat thead th span{display:inline-block;writing-mode:vertical-rl;
  transform:rotate(180deg);max-height:96px;overflow:hidden;}
.kb-heat tbody th{color:var(--ink-2);font-size:12px;padding-right:10px;}
.kb-cell{--f:0;width:100%;min-width:30px;height:26px;border:0;border-radius:4px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink);
  background:color-mix(in oklab,var(--accent),transparent calc(100% - var(--f) * 62%));
  transition:outline-color .12s;outline:1.5px solid transparent;}
.kb-cell:hover{outline-color:var(--ink-3);}
.kb-cell.nil{background:var(--paper-2);cursor:default;}
.kb-cell.nil:hover{outline-color:transparent;}

/* ─── Knowledge page (устаревшее, осталось от инженерной консоли) ────── */
.k-kpi-row{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:16px;
  margin-bottom:28px;align-items:end;
}
.k-kpi{padding:14px 16px;border:1px solid var(--hair);border-radius:8px;background:var(--surface)}
.k-kpi-num{font-size:32px;font-weight:600;color:var(--ink);font-feature-settings:"tnum"}
.k-kpi-frac{font-size:18px;color:var(--ink-3);font-weight:400}
.k-kpi-lbl{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.k-kpi-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}

.k-section{margin-bottom:32px}
.k-section-head{margin-bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.k-section-title{font-size:18px;font-weight:600;color:var(--ink);margin-bottom:4px}

.k-search-wrap{display:flex;gap:8px;margin-bottom:14px}
.k-search-input{
  flex:1;padding:10px 14px;border:1px solid var(--hair-2);border-radius:8px;
  background:var(--surface);font-size:14px;color:var(--ink);
}
.k-search-input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in oklab,var(--ink),transparent 88%)}
.k-search-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px}
.k-search-card{
  --src-accent:var(--neutral-ink);
  padding:12px 14px;background:var(--surface);
  border:1px solid var(--hair);border-radius:8px;border-left:3px solid var(--src-accent);
}
.k-search-card-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.k-search-rel{font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono',monospace;margin-left:auto}
.k-search-crumbs{font-size:11px;color:var(--ink-3);font-style:italic;margin-bottom:6px}
.k-search-text{font-size:13px;line-height:1.5;color:var(--ink-2);margin-bottom:8px}
.k-search-url{font-size:11px;color:var(--accent);font-family:'JetBrains Mono',monospace;
              text-decoration:none;word-break:break-all;display:block}
.k-search-url:hover{text-decoration:underline}

.k-cov-table{width:100%;border-collapse:collapse;font-size:13px}
.k-cov-table th{
  text-align:left;padding:10px 12px;font-weight:500;font-size:11px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  border-bottom:1px solid var(--hair-2);
}
.k-cov-table td{padding:10px 12px;border-bottom:1px solid var(--hair)}
