.rv-explain>*:last-child{margin-bottom:0}
.rv-explain p{margin:0 0 8px}
.rv-explain ul,.rv-explain ol{margin:0 0 8px;padding-left:20px}
.rv-explain li{margin:2px 0}
.rv-explain h1,.rv-explain h2,.rv-explain h3,.rv-explain h4{font-size:13px;font-weight:600;margin:10px 0 4px;font-family:inherit;color:var(--ink)}
.rv-explain strong{font-weight:600}
.rv-explain-err{color:var(--ink-3)}

/* ─── RADAR: срочные аномалии (премиальный блок) ─────────────────────────── */
.rv-radar{position:relative;overflow:hidden;
  
  border-color:var(--hair)}
.rv-radar::before{display:none}
.rv-radar{min-height:152px}
.rv-radar-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;
  border-bottom:1px solid var(--hair)}
.rv-radar-ico{display:flex;color:var(--ink-2);}
.rv-radar-live{width:10px;height:10px;flex:none;border-radius:50%;background:var(--neg);
  box-shadow:0 0 0 0 color-mix(in oklab,var(--neg),transparent 30%);animation:rv-ping 2s ease-out infinite}
.rv-radar-live.scan{animation-duration:1s}
@keyframes rv-ping{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--neg),transparent 30%)}
  70%{box-shadow:0 0 0 7px color-mix(in oklab,var(--accent),transparent 100%)}
  100%{box-shadow:0 0 0 0 color-mix(in oklab,var(--accent),transparent 100%)}}
/* скан-состояние */
.rv-radar-scan{display:flex;flex-direction:column;gap:10px;padding:6px 0 4px}
.rv-radar-scan span{font-size:11px;color:var(--ink-3)}
.rv-radar-beam{height:6px;border-radius:4px;background:color-mix(in oklab,var(--ink-4),var(--surface) 86%);
  background-image:linear-gradient(90deg,transparent,color-mix(in oklab,var(--ink-4),transparent 35%),transparent);
  background-size:45% 100%;background-repeat:no-repeat;animation:rv-sweep 1.25s ease-in-out infinite}
@keyframes rv-sweep{0%{background-position:-50% 0}100%{background-position:150% 0}}
/* спокойно */
.rv-radar-calm{font-size:13px;color:var(--ink-2);padding:6px 0;display:flex;align-items:center;gap:8px}
.rv-radar-check{display:inline-flex;color:var(--pos)}
/* чипы всплесков — цвет по приоритету (high/medium), не по risk */
.rv-radar-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.rv-radar-chip{display:inline-flex;align-items:center;gap:6px;padding:2px 6px 2px 10px;border-radius:14px;
  font-size:11px;cursor:pointer;border:1px solid var(--hair-2);background:var(--surface);color:var(--ink);
  transition:transform .12s,box-shadow .12s,border-color .12s}
.rv-radar-chip:hover{transform:translateY(-1px);box-shadow:var(--shadow-1)}
.rv-radar-chip b{font-size:11px;font-weight:600;padding:0px 6px;border-radius:10px;
  background:var(--ink-3);color:var(--surface);letter-spacing:.02em}
.rv-radar-chip.lvl-high{border-width:1.5px;border-color:color-mix(in oklab,var(--neg),transparent 35%);
  background:color-mix(in oklab,var(--neg),var(--surface) 90%);padding:4px 8px 4px 10px}
.rv-radar-chip.lvl-high b{background:var(--neg);color:#fff}
.rv-radar-chip.only{box-shadow:inset 3px 0 0 var(--neg)}
.rv-radar-acc{display:inline-flex;color:var(--neg)}
.rv-radar-chip:focus-visible{outline:2px solid var(--select);outline-offset:2px}
/* LLM-резюме */
.rv-radar-brief{font-size:12px;line-height:1.55;color:var(--ink);animation:fade .3s ease both}
.rv-radar-brief>*:first-child{margin-top:0}.rv-radar-brief>*:last-child{margin-bottom:0}
.rv-radar-brief p{margin:0 0 6px}
.rv-radar-brief ul{margin:0;padding-left:2px;list-style:none}
.rv-radar-brief li{margin:0 0 8px;padding-left:16px;position:relative}
.rv-radar-brief li::before{content:"";position:absolute;left:2px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--ink-4)}
.rv-radar-brief strong{font-weight:600;color:var(--ink)}

@media(max-width:920px){   /* в один столбец выравнивание высот не нужно */
  .rv-ovl-right{width:100%}
  .rv-kpis{grid-template-columns:repeat(2,1fr)}
  .rv-trow{grid-template-columns:1fr 80px 44px 50px}
}
@media(max-width:760px){
  .rv-chips{width:100%}.rv-chip{flex:1;text-align:center}
}
@media(max-width:520px){
  .rv-kpis{grid-template-columns:1fr}
  .rv-trow{grid-template-columns:1fr 48px 44px}   /* прячем бар на узком */
  .rv-trow .rv-tbarw{display:none}
  .rv-ovl{padding:0}
  .rv-ovl-card{width:100vw;max-height:100vh;border-radius:0;border:none}
}

/* ─── OVERVIEW · Утренний брифинг аудитора (bf-) ─────────────────────────────
   Дневной выпуск: masthead с LLM-заголовком → пульс → карточки-инсайты +
   новости → тарифные движения → подвал доверия. Слой изолирован (bf-),
   всё на существующих переменных. */
.bf-stamp{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-4)}
.bf-refresh{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair-2);background:var(--surface);
  border-radius:var(--r);padding:4px 10px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3);
  cursor:pointer;transition:color .12s,border-color .12s}
.bf-refresh:hover{color:var(--ink);border-color:var(--ink-4)}
.bf-refresh:disabled{opacity:.5;cursor:default}
.bf-live{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3)}
.bf-live .dot{width:6px;height:6px;border-radius:50%;background:var(--warn);animation:pulse 1.6s ease infinite}

/* пульс дня — детерминированный тикер, живёт без LLM */
/* объяснимость цифр: тёмный поповер по наведению (data-tip) */
.bf-tip{position:relative;}
.bf-tip{position:relative}
/* старая CSS-подсказка отключена: рисуется порталом TipLayer, иначе обрезалась */
.bf-tip--off::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-family:'Geist','Inter',sans-serif;font-size:11px;font-weight:400;
  line-height:1.55;letter-spacing:0;text-transform:none;padding:8px 12px;border-radius:8px;width:max-content;max-width:300px;
  white-space:normal;text-align:left;z-index:60;box-shadow:var(--shadow-2);pointer-events:none;}
.bf-tip--off::before{content:"";position:absolute;left:50%;bottom:100%;transform:translateX(-50%) rotate(45deg);
  margin-bottom:4px;width:9px;height:9px;background:var(--ink);z-index:61;pointer-events:none;}
/* ── Пульс дня: сменный лист аудитора (переработан 23.07.2026) ─────────────
   Было repeat(6,1fr) + nowrap/ellipsis → подписи обрезались («СБЕР VS МЕДИАНА РЫ…»).
   Стало 4 колонки, hero на две, подпись переносится на 2 строки. */
.bf-pulse{display:grid;grid-template-columns:repeat(4,1fr);gap:0px;background:var(--hair);
  border:1px solid var(--hair);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-1)}
.bf-t{display:block;background:var(--surface);padding:12px 16px 12px;min-width:0;
  text-decoration:none;color:inherit;transition:background .12s}
a.bf-t:hover{background:var(--paper-2,var(--surface));filter:brightness(.985)}
.bf-t-hero{grid-column:span 2}
.bf-t-wide{grid-column:span 2}
.bf-t.attn{background:color-mix(in oklab,var(--warn),transparent 92%)}
.bf-t.alarm{background:var(--accent-soft)}
.bf-t-cap{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;line-height:1.4;
  white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;min-height:2.3em}
.bf-t-chip{display:inline-block;font-size:9px;letter-spacing:.06em;border:1px solid var(--accent);
  color:var(--accent);border-radius:14px;padding:0 6px;margin-left:6px;vertical-align:1px}
.bf-t-val{font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:500;
  line-height:1.12;display:inline-block;font-variant-numeric:tabular-nums}
.bf-t-hero .bf-t-val{font-size:24px}
.bf-t-val small{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);font-weight:400}
.bf-t-sub{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink-3);
  margin-top:4px;line-height:1.45}
.bf-t-delta{display:block;margin-top:2px;font-weight:500}
.bf-t-delta.good{color:var(--pos)}
.bf-t-delta.bad{color:var(--accent)}
.bf-stampline{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-4);
  margin:8px 0 0;line-height:1.7}
/* строка-штамп переносится КАК ТЕКСТ: при display:flex каждый разделитель «·»
   становился отдельным элементом и отрывался на свою строку (мобилка) */
.bf-stampline a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--hair-2)}
.bf-stampline a:hover{color:var(--ink-2)}
.bf-stampline a.warn,.bf-stampline .bf-stale{color:var(--warn)}
@media(max-width:1100px){.bf-pulse{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.bf-pulse{grid-template-columns:repeat(2,1fr)}
  .bf-t-hero,.bf-t-wide{grid-column:span 2}
.bf-t-wide{grid-column:span 2}.bf-t-cap{-webkit-line-clamp:3;min-height:0}}

/* ядро: лента инсайтов + новостная колонка */
.bf-core{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:16px;align-items:start}
.bf-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bf-card{position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);
  padding:16px 16px 14px 20px;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:8px;min-width:0;
  animation:fade .25s ease both;animation-delay:calc(var(--i,0)*60ms)}
.bf-card.lead{grid-column:1/-1}
/* нечётное число карточек после ведущей — последняя на всю ширину, без дыры в сетке */
.bf-cards>.bf-card:not(.lead):last-child:nth-child(even){grid-column:1/-1}
.bf-card::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:4px;
  background:var(--sev,var(--ink-4))}
.bf-legend{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:10px 2px 0;
  font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono',ui-monospace,monospace}
.bf-legend span{display:inline-flex;align-items:center;gap:6px}
.bf-legend .d{width:8px;height:8px;border-radius:50%;flex:none}
.bf-legend .d.risk{background:var(--neg)}
.bf-legend .d.watch{background:var(--warn)}
.bf-legend .d.good{background:var(--pos)}
.bf-legend .sep{color:var(--ink-4)}
.bf-legend .gl{--sev:var(--ink-3)}
.bf-legend .bf-glyph{width:16px;height:16px}
@media(max-width:760px){.bf-legend .gl{display:none}}
.bf-card[data-sev=risk]{--sev:var(--neg)}
.bf-card[data-sev=watch]{--sev:var(--warn)}
.bf-card[data-sev=good]{--sev:var(--pos)}
.bf-kicker{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--sev,var(--ink-3));display:flex;gap:8px;align-items:center}
.bf-kicker .bf-glyph{margin-left:auto}
.bf-title{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:16px;line-height:1.32;letter-spacing:-.01em}
.bf-card.lead .bf-title{font-size:20px}
.bf-sowhat{font-size:12px;line-height:1.55;color:var(--ink-2)}
/* повод для проверки: что проверить и наши данные — тонко, без лишних рамок */
.bf-idea{font-size:12px;line-height:1.5;color:var(--ink-1);padding-left:10px;border-left:2px solid var(--accent)}
.bf-idea-l{display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.bf-ev{font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.45;color:var(--ink-3)}
.bf-upd{margin:-6px 0 22px;padding:12px 16px;border:1px solid var(--hair-2);border-left:3px solid var(--accent);
  border-radius:8px;background:var(--surface)}
.bf-upd-h{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.bf-upd-dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.bf-upd-it{display:flex;gap:12px;align-items:baseline;padding:5px 0;text-decoration:none;color:var(--ink);
  border-top:1px solid var(--hair)}
.bf-upd-it:first-of-type{border-top:0}
.bf-upd-it:hover .bf-upd-t{color:var(--accent)}
.bf-upd-k{flex:none;width:110px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-4);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bf-upd-t{font-size:13.5px;line-height:1.45;transition:color .15s}
.bf-upd-s{color:var(--ink-3)}
@media (max-width:640px){.bf-upd-it{flex-direction:column;gap:2px}.bf-upd-k{width:auto}}
.bf-fb{margin-left:auto;display:inline-flex;gap:2px}
.bf-btn.ai~.bf-fb{margin-left:4px}
.bf-fb-b{border:0;background:transparent;color:var(--ink-4);padding:5px;border-radius:6px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;transition:color .15s,background .15s}
.bf-fb-b svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bf-fb-b.on svg{fill:color-mix(in oklab,var(--accent),transparent 80%)}
.bf-fb-b:hover{color:var(--ink-2);background:var(--hair)}
.bf-fb-b.on{color:var(--accent);background:var(--accent-soft)}
/* фон рынка — одна спокойная строка под карточками вместо тарифных карточек */
.bf-fon{display:flex;gap:12px;align-items:baseline;margin-top:14px;padding:12px 2px 0;border-top:1px solid var(--hair);
  font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.bf-fon-l{flex:none;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4)}
.bf-viz{display:flex;align-items:center;gap:12px;min-height:22px;color:var(--ink-3)}
.bf-prov{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bf-foot{display:flex;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--hair)}
.bf-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair-2);background:var(--surface);
  border-radius:var(--r);padding:4px 10px;font-size:12px;color:var(--ink-2);cursor:pointer;
  transition:color .12s,border-color .12s,background .12s;text-decoration:none}
.bf-btn:hover{color:var(--ink);border-color:var(--ink-4)}
.bf-btn.ai{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);
  background:var(--accent-soft);border-color:color-mix(in oklab,var(--accent),transparent 70%)}
.bf-btn.ai:hover{border-color:var(--accent)}
.bf-quiet{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--ink-3);padding:12px 4px 0}
.bf-quiet .ok{display:inline-flex;color:var(--pos)}

/* delta-стрип тарифного сигнала */
.bf-delta{font-family:'JetBrains Mono',monospace;font-size:13px;font-variant-numeric:tabular-nums;
  display:inline-flex;align-items:center;gap:6px}
.bf-delta .arr{color:var(--ink-4)}

/* новостная колонка (sticky) */
.bf-news{position:sticky;top:76px;background:var(--surface);border:1px solid var(--hair);
  border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:hidden}
.bf-news-h{padding:12px 16px 10px;border-bottom:1px solid var(--hair);display:flex;align-items:baseline;gap:8px}
.bf-news-cov{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink-4)}
.bf-news-g{padding:8px 16px 2px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
.bf-news-it{display:block;padding:8px 16px 10px;border-top:1px solid var(--hair);text-decoration:none;color:inherit;
  transition:background .12s;position:relative}
.bf-news-it:hover{background:var(--paper-2)}
.bf-news-it::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:4px;background:transparent}
.bf-news-it[data-sev=red]::before{background:var(--neg)}
.bf-news-it[data-sev=amber]::before{background:var(--warn)}
.bf-news-it[data-sev=green]::before{background:var(--pos)}
.bf-news-t{font-size:12px;font-weight:500;line-height:1.4}
.bf-news-s{font-size:11px;line-height:1.5;color:var(--ink-2);margin-top:2px}
.bf-news-m{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink-4);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* ── «Позиция» (объединённый Рынок × Сбер), неймспейс mk- ─────────────────── */
.mk-disc{font-size:12px;color:var(--ink-3);max-width:78ch;margin:8px 0 0;padding:8px 12px;border:1px solid var(--hair);border-left:2px solid var(--warn,var(--warn));border-radius:4px;background:var(--surface)}
.mk-strip{position:relative;height:30px;min-width:120px}
.mk-strip-big{height:44px}
.mk-strip .mk-iqr{position:absolute;top:50%;transform:translateY(-50%);height:12px;background:var(--hair);border-radius:4px}
.mk-strip-big .mk-iqr{height:16px}
.mk-strip .mk-med{position:absolute;top:50%;transform:translate(-50%,-50%);width:1.5px;height:22px;background:var(--ink-2)}
.mk-strip-big .mk-med{height:30px}
.mk-strip .mk-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:5px;height:5px;border-radius:50%;background:var(--ink-3);opacity:.55}
.mk-strip-big .mk-dot{width:6px;height:6px}
.mk-strip .mk-dot.sber{width:9px;height:9px;background:var(--sber);opacity:1;box-shadow:0 0 0 2px var(--surface);z-index:2}
.mk-strip-big .mk-dot.sber{width:11px;height:11px}
/* ── Вердикт вкладки «Рынок»: ответ за ноль кликов (редизайн 11.08.2026) ──
   Раньше первым содержательным элементом был абзац методики на 78ch, а
   единственная плохая позиция стояла последней строкой атласа без выделения. */
.mk-verdict{display:grid;grid-template-columns:1fr minmax(280px,360px);gap:24px;align-items:center;
  background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);
  padding:20px 24px;margin-bottom:16px}
@media(max-width:900px){.mk-verdict{grid-template-columns:1fr;gap:16px}}
.mk-vlead{font-family:'Source Serif 4',Georgia,serif;font-size:18px;line-height:1.5;color:var(--ink);
  max-width:62ch;text-wrap:pretty;margin:0}
.mk-vdoubt{font-size:12px;line-height:1.5;color:var(--ink-3);margin:10px 0 0;max-width:62ch}
/* Светофор: перцентиль — главная цифра, ранг вторичен. Цвет только там, где
   позиция действительно слабая: акцент не должен кричать на нейтральном. */
.mk-traffic{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:0px;
  background:var(--hair);border:1px solid var(--hair);border-radius:var(--r)}
.mk-tcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:12px 6px;background:var(--paper-2);border:0;cursor:pointer;transition:background .12s;min-height:64px}
.mk-tcell:hover{background:var(--surface)}
.mk-tcell .v{font-family:'Instrument Serif',Georgia,serif;font-size:20px;line-height:1;color:var(--ink)}
.mk-tcell .l{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);text-align:center;line-height:1.25}
.mk-tcell.flat{background:var(--paper-2);opacity:.72}
.mk-tcell.flat .v{color:var(--ink-4)}
.mk-tcell.good{background:color-mix(in oklab,var(--pos),transparent 90%)}
.mk-tcell.warn{background:color-mix(in oklab,var(--warn),transparent 88%)}
.mk-tcell.bad{background:color-mix(in oklab,var(--accent),transparent 86%)}
.mk-tcell.bad .v{color:var(--accent)}
/* Бейджи достоверности выборки */
.mk-comp{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mk-comp i{font-family:'JetBrains Mono',monospace;font-size:9px;font-style:normal;letter-spacing:.03em;color:var(--ink-3);border-bottom:1px dotted var(--hair-2)}
.mk-trust{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mk-trust i{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.04em;
  text-transform:uppercase;font-style:normal;color:var(--warn);
  border:1px solid color-mix(in oklab,var(--warn),transparent 72%);border-radius:4px;padding:0px 4px}
.mk-apos .pctl{font-size:11px;color:var(--ink-3);margin-left:0px}
/* Чем куплено лучшее значение: разбор условий из offer_enrichment */
.mk-terms{display:block;margin-top:4px;font-size:10px;line-height:1.35;color:var(--ink-3);
  border-bottom:1px dotted var(--hair-2)}
/* Специфичность выше, чем у .mk-apos b (19px serif в колонке ранга): иначе
   доля из компактного бейджа рисовалась крупным числом поверх позиции. */
.mk-apos .mk-terms b, .mk-terms b{font-family:'JetBrains Mono',monospace;
  font-size:10px;line-height:1.35;color:var(--ink-2);font-weight:500}
.mk-termbox{margin-top:12px;padding-top:10px;border-top:1px solid var(--hair)}
.mk-termrow{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline}
.mk-termrow i{font-style:normal;font-size:10px;letter-spacing:.02em;color:var(--ink-3);
  text-transform:uppercase}
.mk-termrow i b{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;
  color:var(--ink);margin-left:4px}
.mk-termrow .mk-termsrc{margin-left:auto;text-transform:none;font-size:9px;
  border-bottom:1px dotted var(--hair-2)}
.mk-termmine{margin-top:6px;font-size:11px;color:var(--ink-2);line-height:1.5}
.mk-termmine b{font-weight:500;color:var(--ink)}
/* Бейдж условий в строке витрины */
.ofc{display:inline-block;margin-left:8px;font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:.04em;text-transform:uppercase;padding:0px 4px;
  border-radius:4px;vertical-align:middle;white-space:nowrap}
.ofc.free{color:var(--pos);border:1px solid color-mix(in oklab,var(--pos),transparent 75%)}
.ofc.cond{color:var(--warn);border:1px solid color-mix(in oklab,var(--warn),transparent 72%)}
/* Неправдоподобное число: не прячем строку, а честно помечаем — аудитор
   должен видеть, что инструмент сам сомневается, и не тратить проверку. */
.ofc.doubt{border-color:var(--warn);color:var(--warn);background:rgba(194,65,12,.07)}
/* Верхняя граница ставки — не ставка. Приставка «до» набирается тише самого
   числа: аудитор видит оговорку, но колонка не перестаёт читаться числами. */
.mk-upto{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:400;
  color:var(--ink-4);letter-spacing:.02em;margin-right:0px}
.ofkind{font-size:10px;color:var(--ink-3);margin-top:2px}
/* Паспорт премиума: цена у всех ноль, сравниваем по порогу */
.mk-prem{margin-top:12px;padding-top:10px;border-top:1px solid var(--hair)}
.mk-premhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.mk-premhead i{font-style:normal;font-size:9px;color:var(--ink-3);
  border-bottom:1px dotted var(--hair-2)}
.mk-premrow{display:flex;gap:24px;flex-wrap:wrap}
.mk-premrow>div{display:flex;flex-direction:column;gap:0px}
.mk-premrow b{font-size:16px;font-weight:500;line-height:1.15}
.mk-premrow .bad b,.mk-premrow div.bad b{color:var(--neg)}
.mk-premrow span{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em}
.mk-premmine{margin-top:8px;font-size:11px;color:var(--ink-2)}
.mk-premhard{margin-top:4px;font-size:10px;color:var(--ink-3)}
/* Выбор подвида продукта: сегмент клиента и вид продукта */
.mk-kind{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mk-kindlbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  margin-right:2px}
.mk-kind .chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
  border:1px solid var(--hair);background:transparent;color:var(--ink-2);font:inherit;
  font-size:12px;cursor:pointer;transition:background .12s,border-color .12s}
.mk-kind .chip:hover{background:var(--surface);border-color:var(--hair-2)}
.mk-kind .chip i{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:9px;
  color:var(--ink-3)}
.mk-kind .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.mk-kind .chip.active i{color:var(--ink-2)}
/* Поле переполнения и маркер объекта аудита на шкале */
.mk-over{position:absolute;top:0;bottom:0;width:6%;
  background:repeating-linear-gradient(45deg,var(--hair) 0 2px,transparent 2px 5px);opacity:.5;pointer-events:none}
.mk-dot.out{opacity:.35}
.mk-sber-line{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:4px;pointer-events:none}
.mk-arow{display:grid;grid-template-columns:170px 1fr 170px 24px;gap:16px;align-items:center;width:100%;padding:12px 24px;border:0;border-bottom:1px solid var(--hair);background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:background .12s}
.mk-arow:hover{background:var(--surface)}
.mk-arow:last-child{border-bottom:0}
.mk-an{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3);letter-spacing:.02em;font-style:normal}
.mk-anote{font-size:12px;color:var(--ink-4)}
.mk-apos b{font-size:18px;font-weight:500;display:block}
.mk-apos b.bad{color:var(--accent)}
.mk-ago{color:var(--ink-4);font-size:14px;text-align:right}
.mk-rk{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink-3);margin-left:4px}
.mk-rk.bad{color:var(--accent)}
.mk-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.mk-kpi{padding:14px 16px}
.mk-kpi b{font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:500;display:block;line-height:1.15}
.mk-kpi b small{font-size:12px;color:var(--ink-3);font-family:'JetBrains Mono',monospace}
.mk-kpi b.bad{color:var(--accent)}
.mk-kpi span{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.mk-noise{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.mk-sber-pin{display:flex;align-items:center;gap:12px;width:100%;padding:12px 24px;border:0;border-bottom:1px solid var(--hair);background:var(--accent-soft,rgba(200,50,30,.05));color:var(--ink);font:inherit;cursor:pointer}
.mk-sber-pin:hover{filter:brightness(.985)}
.mk-more{display:block;width:100%;border-radius:0;border-top:1px solid var(--hair)}
.mk-click{cursor:pointer}
.mk-chrow{display:grid;grid-template-columns:130px 1fr 200px;gap:14px;align-items:center;width:100%;padding:10px 24px;border:0;border-bottom:1px solid var(--hair);background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:background .12s}
.mk-chrow:hover{background:var(--surface)}
.mk-chrow:last-child{border-bottom:0}
.mk-chrow.big .mk-chmove{font-weight:600}
.mk-chrow.hl{box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-soft,rgba(200,50,30,.05))}
.mk-chdate{font-size:10px;color:var(--ink-3)}
.mk-chbank{display:flex;align-items:center;gap:10px;min-width:0}
.mk-chbank>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.mk-chmove{font-size:12px;text-align:right}
.mk-chmove em{font-style:normal;margin-left:6px;font-size:11px}
.mk-chmove em.up{color:var(--pos)}
.mk-chmove em.dn{color:var(--accent)}
.mk-chmove .mk-dv{display:block;font-size:11px;color:var(--ink-2)}
.mk-chmove .mk-dv b{font-weight:600}
.mk-stale{color:var(--warn,var(--warn));font-weight:500}
.mk-pass{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.mk-pass>div{border:1px solid var(--hair);border-radius:6px;padding:8px 12px}
.mk-pass span{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.mk-pass b{font-size:14px;font-weight:500}
.mk-pass i{display:block;margin-top:0px}
.mk-stepw{border:1px solid var(--hair);border-radius:6px;padding:10px 12px 6px}
.mk-steplbl{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3);margin-top:4px}
.mk-dhrow{display:flex;justify-content:space-between;gap:12px;padding:6px 2px;border-bottom:1px solid var(--hair);font-size:12px}
.mk-dhrow:last-child{border-bottom:0}
.mk-dbtns{display:flex;gap:10px;margin-top:16px}
@media(max-width:760px){
  .mk-arow{grid-template-columns:1fr;gap:6px}
  .mk-ago{display:none}
  .mk-chrow{grid-template-columns:1fr;gap:4px}
  .mk-chmove{text-align:left}
}
/* ── Источники: карта доверия для аудитора (src-) ─────────────────────────── */
.src-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.src-card{padding:20px 20px}
.src-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px}
.src-lead{font-size:13px;color:var(--ink-2);margin:0;max-width:52ch}
.src-count{font-size:10px;color:var(--ink-3);white-space:nowrap;padding-top:2px}
.src-what{font-size:12px;color:var(--ink-2);line-height:1.55;margin-bottom:8px}
.src-what b{color:var(--ink);font-weight:600}
.src-list{margin:14px 0 4px;border-top:1px solid var(--hair)}
.src-item{display:block;padding:8px 0;border-bottom:1px solid var(--hair);text-decoration:none;color:inherit}
.src-item:hover{background:var(--surface)}
.src-dom{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:500;flex-wrap:wrap}
.src-w{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;
  font-style:normal;border-radius:14px;padding:0px 6px;border:1px solid var(--hair-2);color:var(--ink-3)}
.src-w.hi{border-color:color-mix(in oklab,var(--pos),transparent 55%);color:var(--pos)}
.src-w.mid{border-color:var(--hair-2);color:var(--ink-2)}
.src-w.lo{border-color:color-mix(in oklab,var(--warn),transparent 55%);color:var(--warn)}
.src-meta{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3);margin-top:2px}
.src-ttl{display:block;font-size:11px;color:var(--ink-3);margin-top:0px}
.src-more{margin-top:10px}
.src-req{margin-top:14px;border-top:1px solid var(--hair);padding-top:12px}
.src-req>summary{cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--accent);list-style:none}
.src-req>summary::-webkit-details-marker{display:none}
.src-req>summary::before{content:"＋ ";font-family:inherit}
.src-req[open]>summary::before{content:"− "}
.src-req-list{margin:10px 0 0;padding-left:16px;font-size:12px;color:var(--ink-2);line-height:1.6}
.src-req-list li{margin:2px 0}
.src-req-list li::marker{color:var(--accent)}
.src-form{margin-top:14px;padding-top:14px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:10px}
.src-form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.src-form label,.src-form-full{display:flex;flex-direction:column;gap:4px}
.src-form label>span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3)}
.src-form label>span i{font-style:normal;color:var(--ink-4);text-transform:none;letter-spacing:0}
.src-form textarea.input{height:auto;padding:8px 12px;line-height:1.5;resize:vertical;font-family:inherit}
.src-check{font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid var(--hair-2)}
.src-check.ok{color:var(--pos);border-color:color-mix(in oklab,var(--pos),transparent 65%)}
.src-check.bad{color:var(--warn);border-color:color-mix(in oklab,var(--warn),transparent 60%)}
.src-form-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.src-done{margin-top:14px;padding:14px 16px;border-radius:8px;border:1px solid var(--hair-2);
  border-left:3px solid var(--pos);background:var(--surface)}
.src-done-t{font-weight:600;color:var(--pos);margin-bottom:4px}
.src-done p{font-size:12px;color:var(--ink-2);margin:0 0 10px;max-width:60ch}
.src-tech>summary{cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);list-style:none}
.src-tech>summary::-webkit-details-marker{display:none}
.src-tech>summary::before{content:"＋ ";}
.src-tech[open]>summary::before{content:"− ";}
@media(max-width:760px){.src-grid{grid-template-columns:1fr}.src-form-row{grid-template-columns:1fr}}

/* ── Всплывашки: портал в body, fixed, поверх всего ────────────────────────
   Раньше попап жил внутри плитки и обрезался контейнером с overflow:hidden
   (полоса пульса, карточки), а hover-фильтры создавали конкурирующие слои. */
.xp{position:relative;display:inline;cursor:help;border-bottom:1px dashed color-mix(in oklab,var(--accent),transparent 55%)}
.xp:focus{outline:none}
.xp-link{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.xp-pop{position:fixed;z-index:9000;padding:12px 14px 12px;text-align:left;
  background:var(--surface);color:var(--ink);border:1px solid var(--hair-2);border-radius:10px;
  box-shadow:var(--shadow-2);font-style:normal;font-weight:400;pointer-events:none;
  font-family:'Geist','Inter',-apple-system,sans-serif;font-size:12px;line-height:1.5;letter-spacing:0;
  animation:xpIn .12s ease}
@keyframes xpIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.xp-pop::before{content:"";position:absolute;width:9px;height:9px;transform:rotate(45deg);
  background:var(--surface);border:1px solid var(--hair-2)}
.xp-pop.xp-a-left::before  {left:-5px;top:18px;clip-path:polygon(0 0,0 100%,100% 100%)}
.xp-pop.xp-a-right::before {right:-5px;top:18px;clip-path:polygon(100% 0,100% 100%,0 0)}
.xp-pop.xp-a-top::before   {left:22px;top:-5px;clip-path:polygon(0 0,100% 0,0 100%)}
.xp-pop.xp-a-bottom::before{left:22px;bottom:-5px;clip-path:polygon(100% 100%,100% 0,0 100%)}
.xp-h{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-4);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--hair)}
.xp-row{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:2px 0;align-items:baseline}
.xp-k{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.xp-v{color:var(--ink-2);font-variant-numeric:tabular-nums}
.xp-row:first-of-type .xp-v{color:var(--ink);font-weight:500}
.xp-note{display:block;margin-top:8px;padding-top:6px;border-top:1px solid var(--hair);
  font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink-4)}
/* текстовая подсказка [data-tip] — тем же порталом */
.tip-pop{position:fixed;z-index:9000;background:var(--ink);color:var(--paper);
  font-family:'Geist','Inter',-apple-system,sans-serif;font-size:12px;font-weight:400;line-height:1.5;
  letter-spacing:0;text-transform:none;padding:8px 12px;border-radius:8px;white-space:pre-line;
  box-shadow:var(--shadow-2);pointer-events:none;animation:xpIn .12s ease}
.bf-prov-sep{color:var(--ink-4)}
@media(max-width:720px){.xp-row{grid-template-columns:1fr;gap:0px}}
@media(max-width:900px){
  .xp .xp-pop{left:auto;right:0;top:calc(100% + 8px);bottom:auto;max-width:88vw}
  .xp .xp-pop::before{left:auto;right:22px;top:-5px;bottom:auto;
    border-left:1px solid var(--hair-2);border-top:1px solid var(--hair-2);
    border-right:none;border-bottom:none}
  .xp-row{grid-template-columns:1fr;gap:0px}}

/* продуктовый чип новости («Ипотека», «Вклады»…) — детектор тегов, правка аналитиков */
.bf-chip{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--hair-2);border-radius:4px;padding:0px 4px;line-height:1.5;white-space:nowrap}
/* Доступность источника из контура. Метка тихая: она предупреждает, а не
   кричит — новость остаётся полезной, даже если по ссылке не пройти. */
.bf-reach{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.04em;
  padding:0px 4px;border-radius:4px;margin-left:6px;white-space:nowrap}
.bf-reach.tg{color:var(--ink-4);border:1px solid var(--hair-2)}
.bf-reach.no{color:var(--warn);border:1px solid rgba(194,65,12,.35);background:rgba(194,65,12,.06)}
.bf-news-empty{padding:20px 16px;font-size:12px;color:var(--ink-3)}

/* сводка жалоб (markdown из reviews_brief) */
.bf-brief{font-size:13px;line-height:1.6;color:var(--ink)}
.bf-brief ul{margin:0;padding-left:2px;list-style:none}
.bf-brief li{margin:0 0 8px;padding-left:16px;position:relative}
.bf-brief li::before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.bf-brief p{margin:0 0 8px}
.bf-stale{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--warn)}

/* подвал доверия */
.bf-trust{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--ink-4);padding:14px 4px 0;border-top:1px solid var(--hair)}
.bf-trust a{color:var(--ink-3);text-decoration:none}
.bf-trust a:hover{color:var(--ink);text-decoration:underline}

@media(max-width:1100px){
  .bf-core{grid-template-columns:1fr}
  .bf-news{position:static}
}
@media(max-width:720px){
  .bf-cards{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  .bf-card{animation:none}
  .bf-live .dot{animation:none}
}

/* ═══ Поведение интерфейса: отклик, материалы, доступность ═══════════════
   Слой добавлен поверх существующих стилей, ничего не переопределяя по
   цветам. Правило одно: всё, что нажимается, отвечает на нажатие, а не на
   отпускание; всё, что плывёт, плывёт по одной кривой. */

/* ── Отклик на нажатие. Реакция на pointer-down: к моменту, когда палец
   поднялся, интерфейс уже ответил. ── */
.btn, .nav-item, .rail-item, .chip, .pill, .tile, .kpi-click, .rv-kpi-click,
.rv-chip, .rv-bcol, .rv-grow-click, .rv-export,
.mk-click, .mk-arow, .mk-chrow, .mk-noise, .mk-sber-pin, .kb-tab, .kb-cell,
.kb-tech, .kb-doc-a, .kb-case-it-t, .dr-think-head, .al-newq, .al-runbar-btn,
.quick-upsell-btn, .s3-cal, .s3-portrait, .cp-row, [role="button"],
.bf-t, .bf-btn, .bf-news-it, .bf-refresh, .icon-btn, .pu-link, .pu-x,
.rv-lnk, .rv-clear, .ask, .pf-save, .src-panel-head {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: transform var(--dur-press) var(--ease-out),
              background var(--dur-quick) var(--ease-out),
              border-color var(--dur-quick) var(--ease-out),
              box-shadow var(--dur-quick) var(--ease-out),
              opacity var(--dur-quick) var(--ease-out);
}
.btn:active, .nav-item:active, .rail-item:active, .chip:active, .pill:active,
.tile:active, .kpi-click:active, .rv-kpi-click:active, .rv-chip:active, .rv-bcol:active, .rv-grow-click:active,
.rv-export:active, .mk-click:active, .mk-arow:active, .mk-chrow:active,
.kb-tab:active, .kb-cell:active, .kb-tech:active, .dr-think-head:active,
.al-newq:active, .al-runbar-btn:active, .quick-upsell-btn:active,
.s3-cal:active, .s3-portrait:active, .cp-row:active, [role="button"]:active,
.bf-t:active, .bf-btn:active, .bf-news-it:active, .icon-btn:active,
.pu-link:active, .rv-lnk:active, .ask:active, .src-panel-head:active {
  transform: scale(var(--press));
  transition-duration: var(--dur-press);
}
/* Кнопка уже смещается на полпикселя — не складываем два эффекта. */
.btn:active { transform: scale(var(--press)) translateY(.5px); }

/* ── Кликабельность видна без подписи: карточка отвечает на наведение
   подъёмом, а на нажатие — возвратом к плоскости. ── */
.kpi-click, .rv-kpi-click, .mk-click, .cp-row, .kb-cell, .tile, .bf-t, .bf-news-it {
  will-change: transform;
}
.kpi-click:hover, .rv-kpi-click:hover, .mk-click:hover, .cp-row:hover, .tile:hover,
.bf-t:hover, .bf-news-it:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-2);
}
.kpi-click:active, .rv-kpi-click:active, .mk-click:active, .cp-row:active, .tile:active,
.bf-t:active, .bf-news-it:active {
  transform: scale(var(--press));
  box-shadow: var(--shadow-1);
}

/* ── Фокус с клавиатуры — один вид на весь интерфейс. Кольцо появляется
   только при навигации с клавиатуры, а не после клика мышью. ── */
:where(a, button, [role="button"], input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}
:where(a, button, [role="button"]):focus:not(:focus-visible) { outline: none; }

/* ── Chrome как материал: содержимое проезжает под полупрозрачным слоем.
   Жёсткая линия под шапкой заменена краевым затуханием — граница видна
   ровно там, где под неё что-то заезжает. ── */
.topbar {
  border-bottom: 0;
  background: color-mix(in oklab, var(--paper), transparent 22%);
  backdrop-filter: var(--mat-chrome);
  -webkit-backdrop-filter: var(--mat-chrome);
}
.topbar::after {
  content: "";
  position: absolute; left: 0; right: 0; top: 100%; height: 14px;
  pointer-events: none;
  background: linear-gradient(to bottom, color-mix(in oklab, var(--paper), transparent 30%), transparent);
  -webkit-mask-image: linear-gradient(to bottom, #000, transparent);
          mask-image: linear-gradient(to bottom, #000, transparent);
}
.rail {
  background: color-mix(in oklab, var(--paper), transparent 18%);
  backdrop-filter: var(--mat-chrome);
  -webkit-backdrop-filter: var(--mat-chrome);
}

/* ── Появление поверхностей: материал прибывает, а не проявляется. Размытие
   и масштаб идут вместе — так поверхность читается как физический слой. ── */
@keyframes surface-in {
  from { opacity: 0; transform: translateY(6px) scale(.985); filter: blur(6px); }
  to   { opacity: 1; transform: none; filter: none; }
}
/* Целый экран не размываем: на большой площади это дорого и мешает читать
   уже прибывший текст. Экран приезжает сдвигом, материализуются — панели. */
@keyframes screen-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}
.fade-in { animation: screen-in var(--dur-quick) var(--ease-out) both; }

/* ── Меньше прозрачности: материал становится плотным, размытие снимается,
   границы проявляются. ── */
@media (prefers-reduced-transparency: reduce) {
  .topbar, .rail { background: var(--paper); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .topbar { border-bottom: 1px solid var(--hair); }
  .topbar::after { display: none; }
  .dr-viz, .surface { backdrop-filter: none; }
}

/* ── Больше контраста: поверхности получают явную границу, приглушённый
   текст подтягивается к основному. ── */
@media (prefers-contrast: more) {
  :root { --hair: oklch(72% 0.01 260); --hair-2: oklch(60% 0.01 260); --ink-3: oklch(44% 0.012 260); }
  .surface, .surface-flat, .topbar, .rail { border-color: var(--hair-2); }
  .btn-ghost { border-color: var(--ink-3); }
}

/* ── Меньше движения: смысловые изменения остаются, вестибулярные уходят.
   Отклик на нажатие сохраняем — он не про перемещение, а про причинность. ── */
@media (prefers-reduced-motion: reduce) {
  .fade-in { animation: none; }
  .kpi-click:hover, .rv-kpi-click:hover, .mk-click:hover, .cp-row:hover, .tile:hover { transform: none; }
  * { scroll-behavior: auto !important; }
}

/* ── Типографика: трекинг зависит от кегля. Крупный текст стягиваем,
   мелкий — разряжаем, тело оставляем нейтральным. ── */
.content h1, .dg-h1, .dr-doc-main h1 { letter-spacing: -.022em; line-height: 1.06; }
.content h2, .dr-doc-main h2 { letter-spacing: -.014em; line-height: 1.18; }
.content h3, .dr-doc-main h3 { letter-spacing: -.008em; line-height: 1.28; }
.eyebrow, .rail-section, .mono small, small.mono { letter-spacing: .07em; }

/* ── Поверхности приходят и уходят одним путём. Модальное окно
   материализуется от центра, правая панель въезжает справа и уезжает
   вправо — «если что-то исчезло вбок, оттуда же оно и появится». ── */
.rv-ovl { animation: scrim-in var(--dur-quick) var(--ease-out) both; }
@keyframes scrim-in { from { opacity: 0 } to { opacity: 1 } }
.rv-ovl-card { animation: sheet-in var(--dur-base) var(--ease-spring) both; transform-origin: center; }
@keyframes sheet-in {
  from { opacity: 0; transform: scale(.96) translateY(8px); filter: blur(8px); }
  to   { opacity: 1; transform: none; filter: none; }
}
.rv-ovl-right { animation: panel-in var(--dur-base) var(--ease-spring) both; }
@keyframes panel-in {
  from { opacity: .4; transform: translateX(28px); }
  to   { opacity: 1; transform: none; }
}
/* Закрытие — зеркало открытия: те же путь и кривая, только в обратную
   сторону. Окно, которое исчезает мгновенно, читается как сбой. */
.rv-ovl.is-closing { animation: scrim-out var(--dur-quick) var(--ease-out) both; }
@keyframes scrim-out { to { opacity: 0 } }
.rv-ovl.is-closing .rv-ovl-card { animation: sheet-out var(--dur-quick) var(--ease-out) both; }
@keyframes sheet-out {
  from { opacity: 1; transform: none; }
  to   { opacity: 0; transform: scale(.97) translateY(6px); }
}
.rv-ovl.is-closing .rv-ovl-right { animation: panel-out var(--dur-quick) var(--ease-out) both; }
@keyframes panel-out {
  from { opacity: 1; transform: none; }
  to   { opacity: .3; transform: translateX(28px); }
}
@media (prefers-reduced-motion: reduce) {
  .rv-ovl.is-closing, .rv-ovl.is-closing .rv-ovl-card, .rv-ovl.is-closing .rv-ovl-right { animation: none; opacity: 0; }
}

/* Всплывающие подсказки растут из своего источника, а не из ниоткуда. */
.tip-pop, .xp-pop, .shr-pop { animation: pop-in var(--dur-quick) var(--ease-out) both; }
@keyframes pop-in {
  from { opacity: 0; transform: scale(.94) translateY(-2px); }
  to   { opacity: 1; transform: none; }
}

/* ── Краевое затухание под шапкой — только когда под неё заезжает контент.
   Там, где браузер умеет анимацию по прокрутке, оно проявляется само; где
   не умеет — остаётся постоянным и лёгким. ── */
@supports (animation-timeline: scroll()) {
  .topbar::after {
    opacity: 0;
    animation: edge-fade linear both;
    animation-timeline: scroll(root);
    animation-range: 0 64px;
  }
  @keyframes edge-fade { to { opacity: 1 } }
}

/* ── Читаемый текст уважает системный размер шрифта: тело документов и
   длинные тексты — в rem, хром остаётся фиксированным, как в нативных
   приложениях. ── */
.dr-doc-main p, .dr-doc-main li, .dg-lede, .pu-msgbody {
  font-size: 0.9375rem;   /* 15px при системных 16 */
  line-height: 1.62;
}
.dr-doc-main h1 { font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem); }
.dr-doc-main h2 { font-size: clamp(1.15rem, 1rem + .6vw, 1.4rem); }

/* Остановка прогона: кнопка занимает место отправки, но выглядит спокойнее —
   это не главное действие, а выход из ожидания. */
.composer-stop{background:var(--paper-2)!important;color:var(--ink-2)!important;border:1px solid var(--hair-2)!important}
.composer-stop:hover{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--ink-4)!important}
.composer-stop svg{width:14px;height:14px}

/* ── Прокрутка внутри панели остаётся внутри панели: докрутив список до
   конца, человек не должен внезапно поехать по странице под ним. ── */
.rv-ovl-body, .chat-feed, .pu-drawer, .kb-list, .dr-doc-main, .src-panel-body {
  overscroll-behavior: contain;
}
/* Плавная прокрутка ленты мешает, когда человек крутит сам: движение нельзя
   перехватить на полпути. Оставляем её только там, где прокручивает код. */
.chat-feed { scroll-behavior: auto; }

/* ── Нажатие не выделяет текст: двойной клик по кнопке должен нажимать её,
   а не подсвечивать подпись. ── */
.btn, .nav-item, .seg-btn, .rv-chip, .chip, .pill, .bf-t, .icon-btn, .s3-cal, .s3-portrait {
  user-select: none; -webkit-user-select: none;
}

/* ── Палец не должен целиться: минимальная зона нажатия на тач-экранах. ── */
@media (pointer: coarse) {
  .btn, .nav-item, .chip, .pill, .rv-chip, .kb-tab { min-height: 44px; }
  .btn-sm { min-height: 36px; }
}

.rv-spike::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--neg);transform:translateY(-1px)}

/* ── волна D3: шапка, подвкладки, «Главное», активные фильтры ─────────────── */
.rv>.rv-card{margin-bottom:14px}
.rv-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:2px 0 12px}
.rv-h1{margin:0 6px 0 0;font-family:'Source Serif 4',Georgia,serif;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
.rv-hfil{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.rv-hsel{height:34px;max-width:240px;padding:0 30px 0 12px;border-radius:9px;border:1px solid var(--hair-2);background:var(--surface);font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.rv-hsel:focus-visible{outline:2px solid var(--select);outline-offset:1px}
.rv-hper{height:34px}
.rv-hact{display:flex;align-items:center;gap:8px;margin-left:auto}
.rv-hact-n{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--surface);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.rv-bp{position:relative}
.rv-bp-btn{display:inline-flex;align-items:center;gap:8px;height:34px;max-width:260px;padding:0 10px 0 12px;border-radius:9px;border:1px solid var(--hair-2);background:var(--surface);font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.rv-bp-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-bp-btn:hover,.rv-bp-btn[aria-expanded="true"]{border-color:var(--ink-4)}
.rv-bp-btn:focus-visible{outline:2px solid var(--select);outline-offset:1px}
.rv-bp-pop{position:absolute;left:0;top:40px;z-index:50;width:330px;border:1px solid var(--hair);border-radius:12px;background:var(--surface);box-shadow:var(--shadow-2);overflow:hidden;transform-origin:top left;animation:rv-pop .14s ease-out both}
.rv-bp-in{display:block;width:100%;height:42px;padding:0 14px;border:0;border-bottom:1px solid var(--hair);background:transparent;font:inherit;font-size:13px;color:var(--ink);outline:none}
.rv-bp-list{max-height:360px;overflow-y:auto;overscroll-behavior:contain;padding:6px}
.rv-bp-g{padding:8px 8px 4px;font-size:12px;font-weight:600;color:var(--ink-3)}
.rv-bp-o{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:7px 8px;border:0;border-radius:8px;background:none;font:inherit;font-size:13px;color:var(--ink);text-align:left;cursor:pointer}
.rv-bp-o.act{background:var(--paper-2)}
.rv-bp-o.cur .rv-bp-n{font-weight:600}
.rv-bp-c{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.rv-bp-none{padding:12px 8px;font-size:13px;color:var(--ink-3)}
.rv-tabs{position:sticky;top:var(--topbar);z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -8px 16px;padding:8px;
  background:color-mix(in oklab,var(--paper),transparent 10%);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);box-shadow:0 1px 0 var(--hair)}
.rv-tabs-l{display:flex;align-items:center;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.rv-tabs-l::-webkit-scrollbar{display:none}
.rv-tab{position:relative;display:inline-flex;align-items:center;gap:6px;flex:none;height:34px;padding:0 14px;border:0;border-radius:9px;background:none;font:inherit;font-size:13px;font-weight:500;color:var(--ink-3);white-space:nowrap;cursor:pointer;transition:background-color .12s,color .12s}
.rv-tab:hover{color:var(--ink);background:var(--paper-2)}
.rv-tab.on{color:var(--ink);font-weight:600;background:var(--surface);box-shadow:0 0 0 1px var(--hair-2),var(--shadow-1)}
.rv-tab:active{transform:scale(.98)}
.rv-tab:focus-visible{outline:2px solid var(--select);outline-offset:1px}
.rv-tab-n{font-size:11px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rv-tab-dot{width:6px;height:6px;border-radius:50%;background:var(--select)}
.rv-tabs-r{display:flex;align-items:center;gap:8px;flex:none;font-size:12px;color:var(--ink-3);white-space:nowrap}
.rv-th{display:flex;align-items:center;gap:4px}
.rv-info{position:relative;display:inline-flex;vertical-align:middle}
.rv-info-b{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 4px;border:0;border-radius:6px;background:none;font:inherit;font-size:12px;color:var(--ink-3);cursor:pointer}
.rv-info-b.t{padding:0 8px}
.rv-info-b:hover,.rv-info-b.on{color:var(--ink);background:var(--paper-2)}
.rv-info-b:focus-visible{outline:2px solid var(--select);outline-offset:1px}
.rv-info-pop{position:absolute;left:-8px;top:30px;z-index:45;width:min(380px,calc(100vw - 32px));padding:14px 16px;border:1px solid var(--hair);border-radius:12px;background:var(--surface);box-shadow:var(--shadow-2);
  font-family:'Geist','Inter',system-ui,sans-serif;font-size:13px;font-weight:400;line-height:1.55;letter-spacing:0;text-transform:none;white-space:normal;text-align:left;color:var(--ink-2);
  transform-origin:top left;animation:rv-pop .14s ease-out both}
.rv-info.r .rv-info-pop{left:auto;right:0;transform-origin:top right}
.rv-info-pop b{color:var(--ink);font-weight:600}
.rv-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:stretch;margin-bottom:14px}
.rv-lead{padding:20px 24px;display:flex;flex-direction:column}
.rv-lead .rv-chg,.rv-lead .rv-chg-calm{margin-top:auto}
.rv-kl .rv-tag{text-transform:none;letter-spacing:0;font-weight:500}
.rv-lead-t{margin:10px 0 14px;font-family:'Source Serif 4',Georgia,serif;font-size:22px;font-weight:500;line-height:1.38;letter-spacing:-.01em;color:var(--ink);text-wrap:pretty}
.rv-lead .rv-chg{margin:auto 0 0;padding:0;border:0;background:none;box-shadow:none}
.rv-lead .rv-chg-calm{font-size:13px;color:var(--ink-3)}
.rv-kpis3{grid-template-columns:repeat(3,minmax(0,1fr))}
.rv-grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;margin-bottom:14px}
.rv-geo-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 36px}
.rv-geo-sep{grid-column:1/-1}
.rv-gfocus{white-space:normal;overflow:visible;text-overflow:clip}
.rv-more-l{display:inline-flex;align-items:center;gap:2px;margin-top:10px;padding:0;border:0;background:none;font:inherit;font-size:13px;font-weight:500;color:var(--select);cursor:pointer}
.rv-more-l:hover{text-decoration:underline;text-underline-offset:3px}
.rv-radar-brief.clip{max-height:250px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.rv-active{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 14px}
.rv-achip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 12px;border-radius:999px;border:1px solid color-mix(in oklab,var(--select),transparent 60%);background:var(--select-soft);font:inherit;font-size:12px;font-weight:500;color:var(--ink);cursor:pointer}
.rv-achip:hover{border-color:var(--select)}
.rv-achip:active{transform:scale(.97)}
.rv-achip svg{color:var(--ink-3)}
.rv-areset{padding:0 6px;border:0;background:none;font:inherit;font-size:12px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media(max-width:920px){.rv-hero,.rv-grid2{grid-template-columns:1fr}.rv-geo-grid{grid-template-columns:1fr}}
@media(max-width:760px){
  .rv-head{gap:10px;margin-bottom:10px}
  .rv-h1{font-size:22px}
  .rv-hfil{order:3;flex-basis:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .rv-hsel{max-width:none;width:100%;min-width:0}
  .rv-hper{grid-column:1/-1}
  .rv-hact-l{display:none}
  .rv-tabs{margin:0 -16px 12px;padding:6px 16px}
  .rv-tabs-r .rv-asof{display:none}
  .rv-tab{padding:0 10px}
  .rv-tabs{gap:4px}
  .rv-info-b.t span{display:none}
  .rv-export-a .rv-csv-l{display:none}
  .rv-tab-n{display:none}
  .rv-card:has(> .rv-ct > .rv-export-a) > .rv-ct{flex-wrap:nowrap}
  .rv-legend{font-size:11px}
  .rv-kpis3{grid-template-columns:1fr}
  .rv-lead{padding:16px 18px}
  .rv-lead-t{font-size:17px}
  .rv-ftools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:-6px -16px 12px 0;padding-right:16px}
  .rv-ftools::-webkit-scrollbar{display:none}
  .rv-ftools>*,.rv-ftools .rv-chips-sm{flex:none;width:auto}
  .rv-ftools .rv-fsel{flex:none;max-width:170px}
  .rv-info-pop{position:fixed;left:16px;right:16px;top:auto;bottom:16px;width:auto}
}

/* ── волна D4: движение, графики, плотность, доступность ──────────────────── */
/* график динамики: ось, сетка, значения над столбцами */
.rv-chart{display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px;margin-top:4px}
.rv-yaxis{position:relative}
.rv-yin{position:absolute;left:0;right:0;top:12px;bottom:30px}
.rv-yin span{position:absolute;right:0;transform:translateY(50%);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.rv-plot{position:relative}
.rv-gridl{position:absolute;left:0;right:0;top:12px;bottom:30px;pointer-events:none}
.rv-gridl i{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--hair-2)}
.rv-plot .rv-bars{position:relative;height:196px;padding-top:12px;align-items:stretch}
.rv-plot .rv-bcol{justify-content:flex-start}
.rv-bwrap{position:relative;flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.rv-plot .rv-bar{position:relative;min-height:2px;transform-origin:bottom;animation:rv-grow .42s cubic-bezier(.32,.72,0,1) both}
.rv-plot .rv-bcol:nth-child(n){animation-delay:0s}
@keyframes rv-grow{from{transform:scaleY(.02)}to{transform:none}}
.rv-bar-exp{overflow:visible}
.rv-bar-in{border-radius:3px 3px 0 0}
.rv-bval{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;font-size:11px;font-weight:500;color:var(--ink-2);
  font-variant-numeric:tabular-nums;white-space:nowrap;opacity:0;transition:opacity .12s ease;pointer-events:none}
.rv-bcol:hover .rv-bval,.rv-bcol:focus-visible .rv-bval,.rv-bcol.last .rv-bval{opacity:1}
.rv-bar.hot .rv-bval{opacity:1;color:var(--neg);font-weight:600}
.rv-plot .rv-blab{position:relative;height:30px;margin-top:0;padding-top:6px}
.rv-plot .rv-blab .rv-mev{position:absolute;top:-4px;left:50%;margin:0 0 0 -3px;width:6px;height:6px}
.rv-bcol:focus-visible{outline:2px solid var(--select);outline-offset:2px;border-radius:6px}
@media(max-width:760px){.rv-chart{grid-template-columns:30px minmax(0,1fr);gap:4px}.rv-plot .rv-bars{height:170px}.rv-bcol.last .rv-bval{opacity:0}.rv-bar.hot .rv-bval{font-size:0}.rv-bar.hot .rv-bval::after{content:"пик";font-size:11px}}
/* подвкладки: скользящая подложка общего механизма */
.rv-tabs-l{position:relative}
.rv-tabs-l>.seg-ind{border-radius:9px;background:var(--surface);box-shadow:0 0 0 1px var(--hair-2),var(--shadow-1)}
.seg--ind .rv-tab{position:relative;z-index:1}
.seg--ind .rv-tab.on{background:transparent;box-shadow:none}
/* смена подвкладки — короткое появление, без сдвига макета */
.rv-panel{animation:rv-panel-in .24s cubic-bezier(.32,.72,0,1) both}
@keyframes rv-panel-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* переход «карточка → читалка» */
::view-transition-group(rv-vt-title){animation-duration:.36s;animation-timing-function:cubic-bezier(.32,.72,0,1)}
::view-transition-old(rv-vt-title),::view-transition-new(rv-vt-title){animation-duration:.36s;height:100%;object-fit:none;object-position:left top}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
/* отклик на нажатие — сразу, на pointer-down */
.rv-trow:active,.rv-ix:active,.rv-fi:active,.rv-grow-click:active,.rv-cl:active,.rv-chg-it.click:active,.rv-radar-chip:active,.rv-bp-o:active,.rv-rd-simi:active{transform:scale(.99)}
.rv-bcol:active .rv-bar{filter:brightness(.92)}
.rv-trow,.rv-ix,.rv-fi,.rv-grow-click,.rv-cl{transition:background-color .12s ease,transform .1s ease-out}
/* скелетоны */
.rv-skrows{display:flex;flex-direction:column}
.rv-radar-scan{min-height:200px}
.rv-panel{transition:opacity .2s ease}
.rv-panel.dim{opacity:.5}
/* плотность ленты */
.rv-dens{border:1px solid var(--hair-2);background:var(--surface);width:30px;height:30px}
.rv-dens.on{color:var(--select);border-color:color-mix(in oklab,var(--select),transparent 55%);background:var(--select-soft)}
.rv-fw-list.dense .rv-c{padding:8px 14px 8px 20px}
.rv-fw-list.dense .rv-c-title{-webkit-line-clamp:1;font-size:14px}
.rv-fw-list.dense .rv-c-quote,.rv-fw-list.dense .rv-c-snip{display:none}
.rv-fw-list.dense .rv-c-sig{margin-top:3px}
.rv-fw-list.dense .rv-c.s-neg::before,.rv-fw-list.dense .rv-c.s-warn::before{top:10px;bottom:10px}
/* меньше движения: всё мгновенно, но смысловые смены цвета остаются */
@media(prefers-reduced-motion:reduce){.rv-panel,.rv-plot .rv-bar{animation:none}.rv-bval,.rv-trow,.rv-ix,.rv-fi,.rv-cl{transition:none}
  .rv-trow:active,.rv-ix:active,.rv-fi:active,.rv-grow-click:active,.rv-cl:active,.rv-chg-it.click:active{transform:none}}
/* меньше прозрачности: материалы — сплошные */
@media(prefers-reduced-transparency:reduce){.rv-tabs{background:var(--paper);backdrop-filter:none;-webkit-backdrop-filter:none}
  .rv-rd-head{background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none}}
/* больше контраста: чёткие границы и тёмный вторичный текст */
@media(prefers-contrast:more){.rv-card,.rv-c::after,.rv-tabs{border-color:var(--ink-3)}
  .rv-cap,.rv-c-meta,.rv-c-tl,.rv-tab,.rv-yin span,.rv-blab,.rv-fi-n,.rv-bp-c{color:var(--ink-2)}
  .rv-c::after{background:var(--ink-4)}
  .rv-c.sel,.rv-achip,.rv-tab.on{outline:1px solid var(--ink)}}

@media(max-width:520px){
  .rv-plot .rv-blab:not(.yr) .rv-bmon{visibility:hidden}
  .rv-plot .rv-bcol:nth-child(3n+1) .rv-blab .rv-bmon{visibility:visible}
  .rv-plot .rv-bcol:has(+ .rv-bcol .rv-blab.yr) .rv-blab:not(.yr) .rv-bmon,
  .rv-plot .rv-bcol:has(.rv-blab.yr) + .rv-bcol .rv-blab:not(.yr) .rv-bmon{visibility:hidden}
}

/* шапка «Срочно»: иконка и индикатор по строке заголовка, не по центру блока */
.rv-radar-head{align-items:flex-start}
.rv-radar-ico{margin-top:5px}
.rv-radar-live{margin-top:8px}
@media(max-width:520px){.rv-radar-ico{display:none}}
@media(prefers-reduced-motion:reduce){.rv-radar-live,.rv-radar-live.scan,.rv-radar-beam,.rv .skel{animation:none}}

/* ── Отзывы, волна R1 ─────────────────────────────────────────────────── */
/* Липкие слои вкладки: верхняя полоса + полоса подвкладок. Всё, что липнет
   ниже (читалка рядом со списком) и к чему прокручиваем (карточки), считается
   от одной переменной — иначе шапка читалки уезжала под подвкладки */
.rv{--rv-tabs-h:50px;--rv-sticky:calc(var(--topbar) + var(--rv-tabs-h))}
@media(max-width:760px){.rv{--rv-tabs-h:46px}}
.rv-fw-rd{top:calc(var(--rv-sticky) + 10px);max-height:calc(100vh - var(--rv-sticky) - 20px)}
.rv-c,.rv-cl,.rv-card{scroll-margin-top:calc(var(--rv-sticky) + 10px)}
/* значки «Срочно»: число цветом уровня на мягкой подложке (было белое на
   красном 2,9:1 и янтарное на сером 1,8:1) */
.rv .rv-radar-chip b{background:color-mix(in oklab,var(--ink-3),transparent 84%);color:var(--ink)}
.rv .rv-radar-chip.lvl-high b{background:color-mix(in oklab,var(--neg),transparent 82%);
  color:color-mix(in oklab,var(--neg),var(--ink) 30%)}
.rv .rv-radar-chip.lvl-watch b{background:color-mix(in oklab,var(--warn),transparent 82%);color:var(--warn-ink)}
/* подложка окон: в тёмной теме затемняет, а не осветляет страницу */
html.dark .rv-ovl{background:rgba(0,0,0,.5)}
/* заголовки блоков: плотный интервал, при переносе строки не разъезжаются */
.rv-ttl{line-height:1.25;text-wrap:balance}
/* «журнал сигналов» выровнен по заголовку; на телефоне значка нет — и отступа */
@media(max-width:520px){.rv-jr-open{margin-left:0}}
/* светлая тема: полоса подвкладок лежит на фоне страницы, а не карточки —
   третий серый там 4,2:1, берём на тон темнее */
html:not(.dark) .rv-tabs{--ink-3:oklch(46% 0.012 260)}

/* ── Отзывы, волна R2 ─────────────────────────────────────────────────── */
/* «Главное»: чипы сразу под фразой, свободное место — внизу карточки,
   а не 175 px между текстом и чипами */
.rv-lead-t{margin:10px 0 18px}
.rv .rv-lead .rv-chg{margin:0}
.rv-chg-l{font-size:12px;color:var(--ink-3);margin:0 0 8px}
/* «Срочно»: разбор свёрнут до заголовка и нескольких строк */
.rv-radar-brief.clip{max-height:176px}
.rv-radar-links{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px}
/* пик старше трёх полных месяцев: подписан, но нейтрален */
.rv-bar.pk .rv-bval{opacity:1;color:var(--ink-2);font-weight:600}
@media(max-width:760px){.rv-bar.pk .rv-bval{font-size:0}.rv-bar.pk .rv-bval::after{content:"пик";font-size:11px}}
/* KPI: незначимое изменение — серым, без стрелки */
.rv-ks .rv-flat{color:var(--ink-2);font-weight:500}
/* «Где отличается от рынка»: подсказка, по чему отсортировано */
.rv-ix-ord{font-style:normal;font-weight:400;color:var(--ink-3)}
/* «Проблемы»: отличия и признаки рядом, темы строками в две колонки */
.rv-prob{align-items:stretch}
.rv-prob .rv-flags-g{grid-template-columns:1fr;gap:14px}
.rv-prob .rv-fi-l{white-space:normal}
.rv-trows{columns:2;column-gap:28px}
.rv-trows .rv-trow{break-inside:avoid;grid-template-columns:minmax(0,1fr) 80px 44px 52px}
.rv-cap{text-wrap:pretty}
@media(max-width:520px){.rv-trows .rv-trow{grid-template-columns:minmax(0,1fr) 48px 44px}}
@media(max-width:920px){.rv-trows{columns:1}}
/* срез месяца / города: видимое число — то, по которому отсортировано */
.rv-prof-r{grid-template-columns:minmax(0,1fr) 72px 112px 44px}
.rv-prof-hd{font-size:11px;color:var(--ink-3);padding-top:0}
.rv-prof-hd>span:nth-child(2){text-align:right}
.rv-prof-l{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35}
.rv-prof-x{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.rv-prof-r>span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.rv-prof-none{font-size:12px;color:var(--ink-3);padding:4px 0}
@media(max-width:520px){.rv-prof-r{grid-template-columns:minmax(0,1fr) 60px 44px}}
/* журнал: с какой даты ведётся */
.rv-jr-since{font-size:12px;color:var(--ink-2);padding:8px 10px;border-radius:8px;background:var(--paper-2);margin-bottom:10px}
/* «География»: одна таблица, полоса — индекс вокруг ×1 */
.rv-geo{display:flex;flex-direction:column}
.rv-geo-r{display:grid;grid-template-columns:minmax(0,1fr) 180px 112px 48px;gap:16px;align-items:center;
  padding:8px;border-radius:6px;cursor:pointer;transition:background-color .12s}
.rv-geo-r:not(.rv-geo-hd):hover{background:var(--paper-2)}
.rv-geo-r:focus-visible{outline:2px solid var(--select);outline-offset:1px}
.rv-geo-r:not(.rv-geo-hd):active{transform:scale(.99)}
.rv-geo-hd{cursor:default;font-size:11px;color:var(--ink-3);padding-top:0;padding-bottom:6px;border-bottom:1px solid var(--hair);border-radius:0;margin-bottom:2px}
.rv-geo-hd>span:nth-child(3),.rv-geo-hd>span:nth-child(4){text-align:right}
.rv-geo-sc{display:flex;justify-content:space-between}
.rv-geo-sc i{font-style:normal}
.rv-geo-c{min-width:0}
.rv-geo .rv-gcity{margin:0}
.rv-geo .rv-gfocus{margin-top:3px}
.rv-geo-bar{position:relative;height:8px;border-radius:4px;background:var(--paper-2)}
.rv-geo-bar i{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink-4)}
.rv-geo-bar b{position:absolute;top:0;bottom:0;border-radius:4px}
.rv-geo-r.low .rv-geo-bar b{opacity:.45}
.rv-geo .rv-gn{text-align:right}
.rv-geo .rv-gi{margin:0;min-width:0;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.rv-geo .rv-geo-sep{margin-top:6px}
.rv-geo+.rv-more-l{margin-top:10px}
@media(max-width:600px){
  .rv-geo-hd{display:none}
  .rv-geo-r{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
  .rv-geo-c{grid-column:1;grid-row:1}.rv-geo .rv-gi{grid-column:2;grid-row:1}
  .rv-geo-bar{grid-column:1;grid-row:2}.rv-geo .rv-gn{grid-column:2;grid-row:2}
  .rv-geo .rv-gi{align-self:start}
}
@media(max-width:520px){.rv-fi{grid-template-columns:minmax(0,1fr) 34px 86px;gap:6px}}

/* ── Отзывы, волна R3 ─────────────────────────────────────────────────── */
/* заголовки блоков — h2 (по ним ходит экранный чтец): поля браузера не нужны */
.rv h2.rv-ttl,.rv-ovl h2.rv-ttl{margin:0}
.rv h2.rv-kl{margin:0 0 10px}
/* текст только для экранного чтеца */
.rv-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* подложка окон — через множитель: лист, который тянут пальцем, плавно её
   убирает в обеих темах (раньше инлайн-цвет на --ink осветлял тёмную тему) */
.rv-ovl{background:color-mix(in oklab,var(--ink),transparent calc(100% - 22% * var(--rv-scrim-k,1)))}
html.dark .rv-ovl{background:rgb(0 0 0 / calc(.5 * var(--rv-scrim-k,1)))}
/* телефон: три KPI — сгруппированный список, а не экран из трёх плиток */
@media(max-width:520px){
  .rv-kpis3{gap:0}
  .rv-kpis3>.rv-kpi{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-items:center;
    padding:12px 16px;border-radius:0;margin-top:-1px;box-shadow:none}
  .rv-kpis3>.rv-kpi:first-child{border-radius:var(--r-lg) var(--r-lg) 0 0;margin-top:0}
  .rv-kpis3>.rv-kpi:last-child{border-radius:0 0 var(--r-lg) var(--r-lg)}
  .rv-kpis3 .rv-kl{grid-column:1;grid-row:1;margin:0}
  .rv-kpis3 .rv-ks{grid-column:1;grid-row:2;margin-top:3px}
  .rv-kpis3 .rv-kv{grid-column:2;grid-row:1/span 2;font-size:24px;text-align:right}
}
/* телефон: в строке — город и «Фильтры», остальное в листе */
.rv-ftbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;flex:none;border:1px solid var(--hair-2);
  border-radius:9px;background:var(--surface);font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.rv-ftbtn b{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--ink);color:var(--surface);font-size:11px;font-weight:600}
.rv-ftbtn.on{border-color:var(--ink-3)}
.rv-ftbtn:active{transform:scale(.97)}
@media(max-width:760px){
  .rv-ftools{overflow:visible;margin-right:0;padding-right:0}
  .rv-ftools .rv-fsel{flex:1 1 auto;max-width:none;min-width:0;height:36px}
}
.rv-ovl-card.rv-sheet.rv-sheet-fit{height:auto;max-height:86vh}
.rv-fts{display:flex;flex-direction:column;gap:16px;padding:2px 0 calc(8px + env(safe-area-inset-bottom))}
.rv-fts-r{display:flex;flex-direction:column;gap:6px}
.rv-fts-r>span{font-size:12px;color:var(--ink-3)}
.rv-fts .rv-fsel{width:100%;max-width:none;height:44px;font-size:15px}
.rv-fts .rv-chips{align-self:flex-start}
.rv-fts .rv-chip{min-height:36px;font-size:13px}
.rv-fts-go{height:48px;justify-content:center;font-size:15px;border-radius:12px;margin-top:2px}
/* телефон: действия читалки — внизу листа, в зоне большого пальца */
.rv-rd-foot{display:none}
@media(max-width:760px){
  .rv-sheet .rv-rd-foot{display:flex;gap:10px;flex:none;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--hair);background:var(--surface)}
  .rv-sheet .rv-rd-foot .rv-bt{flex:1;height:46px;justify-content:center;font-size:15px;border-radius:12px}
  .rv-sheet .rv-rd-acts .rv-bt{display:none}
}
/* легенда ленты: метка не отрывается от своей подписи при переносе */
.rv-lg-i{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.rv-lg-i+.rv-lg-i{margin-left:6px}
/* зоны нажатия: не меньше 24 px мышью (WCAG 2.2), около 44 px пальцем —
   невидимым расширением, чтобы не раздувать вёрстку */
.rv-info-b,.rv-jr-open,.rv-more-l,.rv-c-tl{position:relative}
.rv-info-b::after,.rv-jr-open::after,.rv-more-l::after{content:"";position:absolute;inset:-6px -4px}
@media(pointer:coarse){
  .rv-info-b::after{inset:-10px}
  .rv-jr-open::after,.rv-more-l::after{inset:-12px -6px}
  .rv-c-tl::after{content:"";position:absolute;inset:-12px -3px}
  .rv-tabs-l{padding:5px 0;margin:-5px 0}
  .rv-tab::after{content:"";position:absolute;inset:-5px 0}
}

/* ── «Обзор», волна O1 ────────────────────────────────────────────────── */
/* нейтральная дельта: у метрики нет «лучше/хуже» */
.bf-t-delta.flat{color:var(--ink-3)}
/* сравнение со вчера недоступно — сменилась методика */
.bf-method{font-size:12px;color:var(--ink-2);margin:0 0 8px}

/* ── «Обзор», волна O2: система «Отзывов» ─────────────────────────────────
   Гарнитуры — Geist и Source Serif 4 (плюс фирменный Instrument Serif заголовка),
   кегли 11/12/13/15/17/22/28 и 40 у заголовка,
   моноширинный только для кодов, капслок — только надзаголовки, красный —
   только «хуже, значимо, срочно», текст не светлее --ink-3 (≥4,5:1). */
.ov .mono{font-family:inherit;font-variant-numeric:tabular-nums;letter-spacing:0}
.ov .eyebrow{font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
/* шапка выпуска. Заголовок — фирменный: Instrument Serif и красный курсив
   акцента (узнаваемый язык сводки, решение владельца), остальное — система */
.ov .bf-hot{font-style:italic;color:var(--accent)}
.ov .xp:focus-visible{outline:2px solid var(--select);outline-offset:2px;border-radius:3px}
.ov .lede{font-size:17px;line-height:1.5;color:var(--ink-2)}
.ov .bf-stamp,.ov .bf-live{font-family:inherit;font-size:12px;color:var(--ink-3)}
.ov .bf-stampline{font-family:inherit;font-size:12px;line-height:1.6;color:var(--ink-3)}
.ov .bf-stampline a{border-bottom-color:var(--ink-4)}
.ov .bf-stampline a:hover{color:var(--ink)}
.ov .bf-stale{font-family:inherit;font-size:12px}
/* дополнение 15:00 — информация, а не тревога */
.ov .bf-upd{border-left:1px solid var(--hair-2)}
.ov .bf-upd-h{font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.ov .bf-upd-dot{background:var(--ink-4)}
.ov .bf-upd-k{font-family:inherit;font-size:12px;color:var(--ink-3);width:88px}
.ov .bf-upd-t{font-size:13px}
.ov .bf-upd-it:hover .bf-upd-t{color:var(--ink);text-decoration:underline;text-decoration-color:var(--ink-4);text-underline-offset:3px}
/* пульс: шрифты — по системе; цветовая гамма (красный пунктир под цифрами,
   тонированные фоны «внимание/тревога», дельты) — прежняя, решение владельца */
.ov .bf-t-cap{font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);min-height:0}
.ov .bf-t-chip{font-size:11px;letter-spacing:0;text-transform:none}
.ov .bf-t-val{font-family:'Source Serif 4',Georgia,serif;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.ov .bf-t-hero .bf-t-val{font-size:28px}
.ov .bf-t-val small{font-family:'Geist','Inter',-apple-system,sans-serif;font-size:13px;font-weight:400;letter-spacing:0;color:var(--ink-3)}
.ov .bf-t-sub{font-family:inherit;font-size:12px;line-height:1.45;color:var(--ink-3)}
/* карточки: серьёзность — одна полоса слева, остальное спокойно */
.ov .bf-kicker{font-family:inherit;font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.ov .bf-title{font-size:17px;line-height:1.3}
.ov .bf-card.lead .bf-title{font-size:22px;line-height:1.25}
.ov .bf-sowhat{font-size:13px;line-height:1.5}
.ov .bf-idea{font-size:13px;line-height:1.5;color:var(--ink);border-left:0;padding-left:0}
.ov .bf-idea-l{font-family:inherit;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink-2)}
.ov .bf-ev,.ov .bf-prov{font-family:inherit;font-size:12px;color:var(--ink-3)}
.ov .bf-prov-sep{color:var(--ink-3)}
.ov .xp-link{font-family:inherit;font-size:12px;letter-spacing:0;text-transform:none;color:var(--select)}
.ov .bf-prov .xp{border-bottom:0}
.ov .bf-btn{white-space:nowrap;font-size:12px}

.ov .bfb-item.lvl-high{border-left-color:var(--neg);background:none}
.ov .bfb-badge{font-family:inherit;font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;border:0;padding:0;background:none;
  color:var(--ink-3);display:inline-flex;align-items:center;gap:5px}

.ov .bfb-title{font-family:'Source Serif 4',Georgia,serif;font-size:15px;font-weight:600}

/* новости для аудитора: читаемый кегль, мета основным шрифтом */
.ov .bf-news-cov{font-family:inherit;font-size:11px;color:var(--ink-3)}
.ov .bf-news-g{font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.ov .bf-news-t{font-size:13px;line-height:1.4}
.ov .bf-news-s{font-size:12px;line-height:1.5}
.ov .bf-news-m{font-family:inherit;font-size:11px;color:var(--ink-3)}
.ov .bf-chip{font-family:inherit;font-size:11px;letter-spacing:0;text-transform:none;border:0;padding:0;color:var(--ink-3)}

.ov .badge{font-family:inherit;font-size:11px;letter-spacing:0}

.ov table.m-cards td[data-label=""]{color:var(--ink-3)}
/* подвал */
.ov .bf-trust{font-family:inherit;font-size:12px;color:var(--ink-3)}
/* расшифровка «как посчитано» (портал — общая с «Для вас»): без моноширинного и 9 px */
.xp-h{font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.xp-k{font-family:inherit;font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.xp-note{font-family:inherit;font-size:12px;color:var(--ink-3)}
@media(max-width:760px){.ov .lede{font-size:15px}.ov .bf-t-val{font-size:22px}

/* ── «Обзор»: всё ниже пульса ──────────────────────────────────────────── */
.ov h2.eyebrow{margin:0}
.ovc-h{display:flex;align-items:center;gap:8px;margin:0 0 10px}
/* «Что проверить»: ведущая карточка целиком, остальные — списком с раскрытием */
.ov .bf-cards{grid-template-columns:1fr;gap:10px}
.ov .bf-card.c{padding:14px 16px 12px 20px;gap:6px}
.ov .bf-card.c .bf-title{font-size:17px}
.ov .bf-card.closed .bf-sowhat,.ov .bf-card.closed .bf-ev,.ov .bf-card.closed .bf-viz,
.ov .bf-card.closed .bf-prov,.ov .bf-card.closed .bf-foot{display:none}
.ov .bf-card.closed .bf-idea{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ov .bf-card.closed .bf-idea-l{display:inline;margin-right:4px}
.ov .bf-card.closed .bf-idea-l::after{content:":"}
.bf-t-btn{display:inline;padding:0;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.bf-t-btn:hover{text-decoration:underline;text-decoration-color:var(--ink-4);text-underline-offset:4px}
.bf-t-btn:focus-visible,.bf-more:focus-visible,.bf-news-more:focus-visible,.ovt-r:focus-visible{outline:2px solid var(--select);outline-offset:2px;border-radius:4px}
.bf-more{align-self:flex-start;display:inline-flex;align-items:center;gap:2px;padding:4px 0;border:0;background:none;font:inherit;
  font-size:12px;font-weight:500;color:var(--select);cursor:pointer}
.ov .bf-card.c:not(.closed) .bf-more{order:10}
.ov .bf-k-src{font-weight:400;color:var(--ink-3)}
.ov .bf-k-src::before{content:"·";margin-right:6px}
/* новости: колонка не «липнет» выше экрана; пояснение — до трёх строк */
.ov .bf-news{position:static}
.ov .bf-news-s{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bf-news-more{display:block;width:100%;padding:12px 16px;border:0;border-top:1px solid var(--hair);background:none;font:inherit;
  font-size:13px;font-weight:500;color:var(--select);text-align:left;cursor:pointer}
.bf-news-more:hover{background:var(--paper-2)}
/* ── «Тарифы за неделю» ── */
.ovt{margin-bottom:26px}
.ovt-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.ovt-all{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--select);text-decoration:none;white-space:nowrap}
.ovt-all:hover{text-decoration:underline;text-underline-offset:3px}
.ovt-card{padding:6px 8px 10px}
.ovt-sum{margin:10px 12px 10px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.ovt-mass{display:flex;align-items:baseline;gap:10px;margin:0 4px 8px;padding:10px 12px;border-radius:10px;
  background:color-mix(in oklab,var(--warn),transparent 88%);font-size:13px;line-height:1.45;color:var(--ink);text-decoration:none;transition:background-color .12s}
.ovt-mass:hover{background:color-mix(in oklab,var(--warn),transparent 80%)}
.ovt-mass b{font-weight:600}
.ovt-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--warn);transform:translateY(-1px)}
.ovt-g{display:flex;align-items:center;gap:7px;margin:14px 12px 4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.ovt-sb{width:7px;height:7px;border-radius:50%;background:var(--sber)}
.ovt-gl{margin-left:auto;font-weight:500;color:var(--select);text-decoration:none}
.ovt-gl:hover{text-decoration:underline}
.ovt-r{display:grid;grid-template-columns:minmax(0,1fr) 150px 190px 52px;gap:16px;align-items:center;width:100%;
  padding:9px 12px;border:0;border-radius:8px;background:none;font:inherit;text-align:left;color:inherit;cursor:pointer;
  transition:background-color .12s,transform .1s}
.ovt-r:hover{background:var(--paper-2)}
.ovt-r:active{transform:scale(.995)}
.ovt-b{display:flex;flex-direction:column;gap:1px;min-width:0}
.ovt-b b{font-size:13px;font-weight:600;color:var(--ink)}
.ovt-b span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovt-rate{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right;white-space:nowrap}

.ovt-d{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:center}
.ovt-bar{position:relative;height:6px;border-radius:3px;background:var(--paper-2)}
.ovt-bar i{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink-4)}
.ovt-bar b{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--ink-3)}
.ovt-r.own .ovt-bar b{background:var(--sber)}
.ovt-dv{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right;white-space:nowrap}
.ovt-dt{font-size:12px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.ovt-empty{padding:14px 12px;font-size:13px;color:var(--ink-3)}
@media(max-width:900px){.ovt-r{grid-template-columns:minmax(0,1fr) 130px 150px 44px;gap:12px}.ovt-d{grid-template-columns:56px minmax(0,1fr)}}
@media(max-width:600px){
  .ovt-r{grid-template-columns:minmax(0,1fr) auto;row-gap:4px;padding:10px 8px}
  .ovt-b{grid-column:1;grid-row:1}.ovt-rate{grid-column:2;grid-row:1}
  .ovt-d{grid-column:1;grid-row:2;grid-template-columns:56px auto;justify-content:start}.ovt-dt{grid-column:2;grid-row:2}
}
/* ── «Обзор» O4: доступность ─────────────────────────────────────────── */
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
/* плитка пульса = ссылка на всю площадь + кнопка ⓘ в углу (не внутри ссылки) */
.ov .bf-t{position:relative;padding:0;display:flex}
.ov .bf-t:not(.attn):not(.alarm):hover{background:var(--paper-2,var(--surface))}
.ov .bf-t:hover{filter:brightness(.985)}
.bf-t-a{flex:1;min-width:0;display:block;padding:12px 16px;color:inherit;text-decoration:none}
.bf-t-a:focus-visible{outline:2px solid var(--select);outline-offset:-3px;border-radius:6px}
.ov .bf-t-cap{padding-right:22px}
.xp-i{position:absolute;top:7px;right:7px;width:24px;height:24px;display:grid;place-items:center;padding:0;border:0;
  border-radius:50%;background:none;color:var(--ink-3);cursor:help;opacity:.55;
  transition:opacity .15s,color .15s,background-color .15s}
.bf-t:hover .xp-i,.bf-t:focus-within .xp-i,.xp-i[aria-expanded=true]{opacity:1}
.xp-i:hover,.xp-i[aria-expanded=true]{color:var(--ink);background:color-mix(in oklab,var(--ink),transparent 92%)}
.xp-i:focus-visible,.xp-b:focus-visible{opacity:1;outline:2px solid var(--select);outline-offset:1px}
/* «как посчитано» в карточке — текстовая кнопка */
.xp-b{display:inline-flex;align-items:center;min-height:24px;padding:0;border:0;background:none;font:inherit;
  font-size:12px;color:var(--select);cursor:help;border-radius:4px}
.xp-b:hover{text-decoration:underline;text-underline-offset:3px}
.ov .bf-prov{padding:2px 3px;margin:-2px -3px}
/* плашки состояния: спокойная (методика) и заметная (устарело / без ИИ) */
.ov-note{display:flex;align-items:flex-start;gap:8px;margin:12px 0 0;padding:9px 12px;border-radius:10px;
  background:var(--paper-2);font-size:13px;line-height:1.45;color:var(--ink-2)}
.ov-note-ic{flex:none;margin-top:1px;color:var(--ink-3)}
.ov-note.warn{background:color-mix(in oklab,var(--warn),transparent 88%);color:var(--ink)}
.ov-note.warn .ov-note-ic{color:var(--warn-ink)}
.ov-note b{font-weight:600}
section>.ov-note:first-of-type{margin:0 0 10px}
.ov-pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;
  letter-spacing:0;text-transform:none;white-space:nowrap}

.ov .bf-news-g .ov-pill{margin-right:6px}

@media(pointer:coarse){

}
