.k-cov-table tr:hover td{background:color-mix(in oklab,var(--ink),transparent 96%)}
.k-empty{padding:20px;text-align:center;color:var(--ink-3);font-size:13px;
         border:1px dashed var(--hair-2);border-radius:8px}

/* ─── Tools timeline ─────────────────────────────────────────────────── */
.tools-tl{
  display:flex;flex-wrap:wrap;gap:4px;align-items:center;
  margin:-4px 0 12px;padding-bottom:10px;
  border-bottom:1px dashed var(--hair);
  font-size:11px;color:var(--ink-2);
}
.tools-tl-step{display:inline-flex;align-items:center;gap:4px;padding:2px 6px}
.tools-tl-icon{font-size:13px;line-height:1;filter:grayscale(.2)}
.tools-tl-label{font-family:'JetBrains Mono',monospace;letter-spacing:.01em}
.tools-tl-arrow{color:var(--ink-4);margin:0 0px}
.tools-tl-active{
  background:color-mix(in oklab,var(--accent),transparent 88%);
  border-radius:4px;color:var(--accent);font-weight:600;
  animation:tools-pulse 1.4s ease-in-out infinite;
}
@keyframes tools-pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* ─── Citations [N] (ТОЛЬКО quick-режим) ───────────────────────────────────
   Заскоуплено под :not(.chat-bubble-deep): иначе этот поздний pill-стиль
   перебивал editorial-superscript .cite (строки 275-289) в deep-отчёте. */
.chat-bubble:not(.chat-bubble-deep) .cite{
  font-family:'Source Serif 4',serif;font-size:.72em;font-weight:600;color:var(--ink-3);
  text-decoration:none;padding:0 0px;cursor:pointer;background:none;transition:color .12s;
}
.chat-bubble:not(.chat-bubble-deep) .cite:hover{color:var(--accent)}
.chat-bubble:not(.chat-bubble-deep) .cite-anchor{color:var(--ink-3);background:none}
.md-code{background:color-mix(in oklab,var(--ink),transparent 92%);padding:0px 4px;border-radius:4px;font-size:.88em;font-family:'JetBrains Mono',monospace}

.src-panel{
  margin-top:14px;border:1px solid var(--hair);border-radius:8px;
  background:color-mix(in oklab,var(--accent),transparent 96%);
  overflow:hidden;
}
.src-panel-head{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;cursor:pointer;user-select:none;
  border-bottom:1px solid color-mix(in oklab,var(--accent),transparent 90%);
  transition:background .12s;
}
.src-panel-head:hover{background:color-mix(in oklab,var(--accent),transparent 92%)}
.src-panel-icon{display:inline-flex;color:var(--accent)}
.src-panel-title{font-weight:600;font-size:13px;color:var(--ink)}
.src-pill{
  font-size:10px;font-weight:600;padding:2px 6px;border-radius:10px;
  letter-spacing:.02em;
}
.src-item{position:relative}
.src-go{position:absolute;right:12px;top:12px;color:var(--ink-4);font-size:12px;
  opacity:0;transition:opacity var(--dur-quick) var(--ease-out),color var(--dur-quick) var(--ease-out)}
.src-item:hover .src-go,.src-item:focus-visible .src-go{opacity:1;color:var(--ink-2)}
.src-req-cap{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);margin:10px 0 4px}
.src-pill.official  {color:var(--info);background:var(--info-soft)}
.src-pill.regulator {color:var(--legal);background:var(--legal-soft)}
.src-panel-toggle{
  margin-left:auto;background:transparent;border:0;color:var(--ink-3);
  font-size:11px;cursor:pointer;padding:2px 6px;
}
.src-panel-toggle:hover{color:var(--ink)}

.src-panel-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:10px;padding:12px 14px;
}
.src-card{
  --src-accent:var(--neutral-ink);
  display:flex;flex-direction:column;gap:6px;
  padding:10px 12px;background:var(--surface);
  border:1px solid var(--hair);border-radius:6px;
  text-decoration:none;color:var(--ink);
  transition:border-color .12s,transform .12s,box-shadow .12s;
  position:relative;overflow:hidden;
  border-left:3px solid var(--src-accent);
}
.src-card:hover{
  border-color:var(--src-accent);
  transform:translateY(-1px);
  box-shadow:0 4px 12px -4px color-mix(in oklab,var(--ink),transparent 88%);
}
.src-card-head{display:flex;align-items:center;gap:8px}
.src-card-num{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;padding:0 6px;
  background:var(--src-accent);color:#fff;
  border-radius:10px;font-weight:700;font-size:11px;
}
.src-card-doctype{
  margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:2px 4px;
  border:1px solid var(--hair-2);border-radius:4px;
  color:var(--ink-3);
}
.src-card-bank{font-weight:600;font-size:13px;color:var(--ink);line-height:1.3}
.src-card-crumbs{
  font-size:11px;color:var(--ink-3);font-style:italic;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.src-card-foot{display:flex;align-items:center;gap:6px;font-size:11px;flex-wrap:wrap}
.src-card-domain{
  font-family:'JetBrains Mono',monospace;color:var(--ink-2);
  max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.src-card-kind{font-weight:600}
.src-card-date{color:var(--ink-3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--hair-2);border-radius:4px;border:2px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-4)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
/* ── Адаптив под мобильные: drawer-рейл, нативный чат, тач-таргеты, таблицы ──
   Всё строго в @media(max-width:…) — десктоп (≥961px) не меняется. ── */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.rail-backdrop{position:fixed;inset:0;background:oklch(0% 0 0 / .42);z-index:55;animation:fade .18s ease both;-webkit-tap-highlight-color:transparent}
@media(min-width:961px){.rail-backdrop{display:none}}

@media(max-width:960px){
  #app{grid-template-columns:1fr;min-height:100dvh}
  /* выезжающий drawer-рейл */
  .rail{position:fixed;left:0;top:0;height:100dvh;width:min(86vw,320px);transform:translateX(-100%);transition:transform .22s ease;z-index:60;box-shadow:var(--shadow-2);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 14px calc(14px + env(safe-area-inset-bottom))}
  .rail.open{transform:translateX(0)}
  .mobile-nav{display:flex !important}
  .nav-item{padding:10px 10px;font-size:14px;min-height:44px}
  .user-chip{min-height:44px}
  html.nav-lock,html.nav-lock body{overflow:hidden}
  /* топбар */
  .topbar{gap:10px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  .topbar .crumb{min-width:0;flex:1;overflow:hidden}
  .topbar .crumb b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon-btn{width:38px;height:38px}
  .mobile-nav .icon-btn{width:42px;height:42px}
  /* контент */
  .content{padding:20px max(16px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .desk-only{display:none !important}
  /* вкладки-категории переносятся, а не обрезаются */
  .tab-row{flex-wrap:wrap;gap:6px}
  .tab{height:36px}
  /* анти-зум iOS: инпуты ≥16px */
  .input,.select,.chat-textarea,input,textarea,select{font-size:16px}
  .input,.select{height:40px}
  /* таблицы: горизонтальный скролл, без липкой шапки */
  .content table,.dr-doc-main table{display:block;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .content thead th{position:static}
  /* ── ЧАТ: нативный — лента скроллится, композер прибит к низу ── */
  .content:has(.chat-shell){padding:0;max-width:none}
  .chat-shell{grid-template-columns:1fr;height:calc(100dvh - var(--topbar));min-height:0}
  .chat-feed{padding:14px 16px 12px;overscroll-behavior:contain}
  .chat-msg{max-width:100%}
  .chat-msg.ai:has(.chat-bubble-deep){max-width:100%;margin:0}
  /* На мобильном док без отступов/градиента — поля даёт сам .chat-input-wrap */
  .composer-dock{padding:0;background:none}
  .composer-note{display:none}
  /* Deep-консоль/quick на всю ширину */
  .dr-con-wrap,.quick-msg{max-width:100%}
  .dr-con-spine{padding:6px 12px 14px}
  .dr-con-head{padding:12px 14px}
  /* нижний running-бар + thread-head в безопасной зоне */
  .al-runbar{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .al-runbar-text{font-size:12px}
  .al-thread-head{padding:2px 0 10px}
  .chat-input-wrap{margin:8px;margin-bottom:calc(8px + env(safe-area-inset-bottom));border-radius:14px;background:var(--surface);border:1px solid var(--hair-2);box-shadow:var(--shadow-2);overflow:hidden}
  .chat-textarea{font-size:16px;min-height:24px;max-height:120px;padding:12px 14px 4px}
  .composer-bar{padding:6px 10px 10px;gap:8px}
  .composer-hint{display:none}
  .composer-kbd{display:none}
  .composer-send{height:36px;padding:0 14px;font-size:13px}
  .ai-welcome{padding:5vh 16px 32px}
  .aw-title{font-size:28px}
  .aw-cards{grid-template-columns:1fr}
  /* Deep Research графики в одну колонку (380px-min распирал) */
  .dr-charts-wrap{grid-template-columns:1fr;gap:14px}
}

@media(max-width:720px){
  .topbar .crumb-idx{display:none}
  /* ── нативная типографика: комфортный body, дышащий ритм ── */
  body{font-size:14px;line-height:1.55;letter-spacing:-.002em}
  .t-body{font-size:14px;line-height:1.6}
  .t-cap{font-size:12px;line-height:1.5}
  .lede{font-size:16px;line-height:1.6;max-width:none}
  .t-display{font-size:32px;line-height:1.1;letter-spacing:-.018em}
  .t-h{font-size:20px;line-height:1.25}
  .hero-metric .num{font-size:52px;line-height:1}
  /* eyebrow-лейблы (§ … · …) не давят */
  .eyebrow{font-size:11px;letter-spacing:.04em;color:var(--ink-3);line-height:1.4}
  .eyebrow-row{flex-wrap:wrap;gap:6px 12px;margin-bottom:16px}
  /* поверхности → мягкие крупные карточки */
  .surface{border-radius:14px;border-color:var(--hair);box-shadow:0 1px 2px oklch(0% 0 0 / .03),0 6px 20px oklch(0% 0 0 / .04)}
  .surface-flat{border-radius:10px}
  .content .surface{padding:20px 16px !important}
  .row{gap:16px}
  .divider{margin:24px 0}
  section.surface,.content > .surface{margin-bottom:16px}
  /* документ deep-research компактнее */
  .dr-doc-main h1{font-size:24px;line-height:1.25}
  .dr-doc-main h2{font-size:18px;margin:20px 0 6px;padding-top:12px}
  .dr-doc-main h3{font-size:16px}
  .dr-doc-main table{font-size:12px}
  .dr-doc-main thead th,.dr-doc-main tbody td{padding:6px 8px}
  .dr-con-spine{padding-left:12px;padding-right:12px}
  .dr-con-gap-q{max-width:100%}
  .dr-think-head{min-height:44px}
  .dr-doc-toolbar{flex-wrap:wrap;gap:8px 12px}
  .cite-tooltip{width:auto;max-width:calc(100vw - 24px);box-sizing:border-box}
}

@media(max-width:480px){
  .content{padding-top:16px}
  .t-display{font-size:28px;line-height:1.08}
  .hero-metric .num{font-size:40px}
  .t-h{font-size:18px}
  .dr-doc-main h1{font-size:22px}
  .dr-doc-main h2{font-size:16px}
  .topbar{gap:6px}
}

/* ── Десктоп: размер вынесенной из inline дельты Сбера (был fontSize:44) ── */
.sber-delta{font-size:40px}

/* ── Мобильные карточки из таблиц (.m-cards): строка → карточка ── */
@media(max-width:720px){
  .sber-delta{font-size:32px}
  table.m-cards{display:block;width:100%;border:0;overflow:visible}
  table.m-cards thead{position:absolute;width:1px;height:1px;padding:0;margin:-0px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  table.m-cards tbody{display:block}
  table.m-cards tr{display:block;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-1)}
  table.m-cards tr.is-sber{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  table.m-cards tr:hover td{background:transparent}
  table.m-cards td{display:flex;align-items:center;justify-content:space-between;gap:14px;width:auto;border:0;padding:4px 0;text-align:right;font-size:14px;white-space:normal}
  table.m-cards td::before{content:attr(data-label);color:var(--ink-3);font:500 10.5px/1.3 'JetBrains Mono',monospace;letter-spacing:.05em;text-transform:uppercase;text-align:left;flex:none}
  /* первичная ячейка = крупная шапка карточки */
  table.m-cards td.m-primary{display:block;text-align:left;padding:0 0 10px;margin-bottom:8px;border-bottom:1px solid var(--hair);font-size:14px;font-weight:500}
  table.m-cards td.m-primary::before{display:none}
  table.m-cards td.m-primary .right{text-align:left}
  /* ячейка-ранг без подписи: мелкий приглушённый префикс сверху */
  table.m-cards td[data-label=""]{justify-content:flex-start;font-size:11px;color:var(--ink-4);padding:0 0 2px}
  table.m-cards td[data-label=""]::before{display:none}
  /* surface-обёртка вокруг таблицы-карточек: без двойной рамки/паддинга */
  .content .surface:has(table.m-cards){padding:0 !important;background:transparent;border:0;box-shadow:none;overflow:visible}
}
@media(max-width:480px){
  .sber-delta{font-size:28px}
  table.m-cards td{font-size:13px}
}
.mobile-nav{display:none;align-items:center;gap:8px}
.row{display:grid;gap:16px}
.row-7-5{grid-template-columns:7fr 5fr}
.row-2{grid-template-columns:1fr 1fr}
.row-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1100px){.row-7-5{grid-template-columns:1fr}.row-3{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.row-2,.row-3{grid-template-columns:1fr}}
.t-display{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:40px;line-height:1.05;letter-spacing:-.02em}
.t-h{font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.t-body{font-size:14px;line-height:1.55}
.t-cap{font-size:12px;line-height:1.45;color:var(--ink-3)}
/* Пояснение методики: свёрнуто по умолчанию, открывается по клику */
.method-note{margin:10px 0 12px;max-width:82ch}
.method-note-btn{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.method-note-btn:hover{color:var(--ink)}
.method-note-mark{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:1px solid var(--hair-2);border-radius:50%;font-size:10px;color:var(--ink-3)}
.method-note-chev{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.04em;color:var(--ink-4)}
.method-note-body{margin-top:8px;padding:12px 14px;border:1px solid var(--hair);border-radius:var(--r-md,8px);background:var(--paper-2);font-size:13px;line-height:1.5;color:var(--ink-2)}
.method-note-body p{margin:0 0 8px}
.method-note-body p:last-child{margin-bottom:0}
.method-note-body b{color:var(--ink);font-weight:600}
.lede{font-size:16px;line-height:1.55;color:var(--ink-2);max-width:62ch}
.divider{height:1px;background:var(--hair);margin:28px 0}
.eyebrow-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.fade-in{animation:fade .25s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ─── REVIEWS · риск-радар голоса клиента ─────────────────────────────────── */
.rv{max-width:1320px;margin:0 auto}
/* размер всего корпуса — контекст, а не главное число: приглушаем,
   чтобы не спорил с цифрами по выбранному банку */

.rv-up{color:var(--neg);font-weight:600}
.rv-down{color:var(--pos);font-weight:600}
.rv-flat{color:var(--ink-3)}
.rv-card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);padding:16px 20px;box-shadow:var(--shadow-1)}
.rv-ttl{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--ink)}
.rv-cap{font-size:11px;color:var(--ink-3);margin-top:2px;margin-bottom:14px;line-height:1.4}
.rv-ct{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.rv-ct>div:first-child{min-width:0}

/* filters */

.rv-chip{padding:0 12px;font-size:11px;color:var(--ink-3);background:var(--surface);border:none;border-right:1px solid var(--hair-2);cursor:pointer;transition:background .12s,color .12s}

.rv-export:disabled{opacity:.4;cursor:default}
.rv-export-a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;flex:none;height:30px}

/* KPI */
.rv-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.rv-kpi{padding:16px 20px}
.rv-kl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;display:flex;align-items:center;gap:6px;min-height:13px}
.rv-kv{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:28px;line-height:1.02;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);word-break:break-word}
.rv-ks{font-size:11px;color:var(--ink-3);margin-top:10px;line-height:1.4}

/* trend bars */
.rv-bars{display:flex;align-items:flex-end;gap:4px;height:130px;padding-top:8px}
.rv-bcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:default}
.rv-bar{width:100%;max-width:34px;background:var(--ink-4);border-radius:4px 4px 0 0;transition:background .12s;min-height:4px}
.rv-bcol:hover .rv-bar{background:var(--ink-2)}
.rv-bar.hot{background:var(--neg)}
.rv-blab{font-size:11px;color:var(--ink-3);margin-top:6px;white-space:nowrap;text-align:center;line-height:1.25}
.rv-byr{display:block;color:var(--ink-3)}
@media(max-width:520px){.rv-bcol:nth-child(even) .rv-blab:not(.yr) .rv-bmon{visibility:hidden}}
.rv-spike{margin-top:12px;display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-2);line-height:1.45}

/* two-col */

/* аналитика — 2 колонки: слева динамика+темы (шире), справа гео+рынок */
   /* нижняя карточка добирает высоту → колонки вровень, без бокового зазора */

/* theme risk-map */
.rv-trow{display:grid;grid-template-columns:1fr 120px 52px 56px;align-items:center;gap:12px;padding:8px 8px;border-radius:6px;cursor:pointer;transition:background .12s;border:1px solid transparent}
.rv-trow:hover{background:var(--paper-2)}
.rv-trow.sel{background:var(--select-soft);border-color:color-mix(in oklab,var(--select),transparent 70%)}
.rv-tname{font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.rv-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--ink-3);white-space:nowrap;flex:none;padding:0;border:0;background:none;line-height:1.3}
.rv-tag.compliance{color:var(--ink-3)}
.rv-tag.conduct{color:var(--ink-3)}
.rv-tag.ops{color:var(--ink-3)}
.rv-tag.other{color:var(--ink-3)}
.rv-trow-static{cursor:default;opacity:.72}
.rv-trow-static:hover{background:transparent}
.rv-th-toggle{font-size:11px;color:var(--ink-2);cursor:pointer;padding:6px 8px;border-radius:6px}
.rv-th-toggle:hover{background:var(--paper-2)}
.rv-th-toggle:focus-visible{outline:2px solid var(--select);outline-offset:2px}
.rv-tbarw{height:8px;background:var(--paper-2);border-radius:4px;overflow:hidden}
.rv-tbar{height:100%;border-radius:4px;transition:filter .12s;
  background:color-mix(in oklab,var(--ink-3),transparent 30%)}
.rv-tbar.n{background:color-mix(in oklab,var(--ink-4),transparent 25%)}
.rv-trow:hover .rv-tbar{filter:brightness(1.08) saturate(1.05)}
.rv-tn{font-size:12px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rv-ttr{font-size:11px;text-align:right}

/* geo */
.rv-grow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px}
.rv-gcity{font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.rv-gbar{height:9px;border-radius:4px;min-width:5px;max-width:100%;box-shadow:var(--shadow-1);transition:width .35s ease,filter .12s}
.rv-gbar.anom{filter:drop-shadow(0 0 3px color-mix(in oklab,var(--neg),transparent 45%))}
.rv-grow-click:hover .rv-gbar{filter:brightness(1.06)}
.rv-gn{font-size:11px;color:var(--ink-2);white-space:nowrap;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.rv-gp{color:var(--ink-3)}

/* vs market */

/* feed */
.rv-search{position:relative;display:flex;align-items:center;gap:8px;margin:6px 0 16px;padding:0 12px;height:40px;border:1px solid var(--hair-2);border-radius:8px;background:var(--paper-2);transition:border-color .12s,box-shadow .12s}
.rv-search:focus-within{border-color:var(--ink);background:var(--surface);box-shadow:0 0 0 3px color-mix(in oklab,var(--ink),transparent 90%)}
.rv-search>span:first-child{color:var(--ink-3);font-size:14px}
.rv-search input{flex:1;border:none;background:transparent;font-size:13px;color:var(--ink);font-family:'Geist',sans-serif}
.rv-search input:focus{outline:none}

/* Банк обращения: тише темы, но читаемо — это опорный факт, а не украшение. */

.rv-count-note{font-weight:400;font-size:12px;color:var(--ink-3)}
/* Тема, по которой отфильтрована лента: остальные ярлыки — контекст, а не ошибка. */

/* Плашка-фильтр: показываем, что по ней можно нажать, и что фильтр включён. */
.rv-kpi-click{cursor:pointer;transition:border-color .12s}
.rv-kpi-click:hover{border-color:var(--ink-4)}
.rv-kpi-on{border-color:var(--select);box-shadow:inset 0 0 0 1px var(--select)}
.rv-sort{display:flex;align-items:center;gap:6px;margin:10px 0 2px}

.rv-more-btn{display:block;margin:14px auto 4px;min-width:260px}
/* волна 3: что изменилось · против рынка по проблемам · гео-индекс · признаки риска */
.rv-chg{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin:0 0 14px;padding:10px 14px;border:1px solid var(--hair);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-1)}
.rv-chg-it{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink);padding:3px 10px;border-radius:999px;border:1px solid var(--hair-2);background:var(--paper-2);white-space:nowrap}
.rv-chg-ar{font-weight:700}
.rv-chg-it.up .rv-chg-ar{color:var(--neg)}
.rv-chg-it.down .rv-chg-ar{color:var(--pos)}
.rv-chg-it.sig{border-color:color-mix(in oklab,var(--neg),transparent 60%);background:color-mix(in oklab,var(--neg),var(--surface) 94%)}
.rv-chg-it.click{cursor:pointer;transition:border-color .12s}
.rv-chg-it.click:hover,.rv-chg-it.on{border-color:var(--select)}

/* высота — по чипам: на сенсорных экранах у них минимум 44px, и в
   фиксированной высоте контейнера подпись обрезалась */
.rv-chips-sm{height:auto;flex:none}

.rv-bar-exp{background:transparent!important;border:1px dashed color-mix(in oklab,var(--ink-4),transparent 15%);border-bottom:none;display:flex;align-items:flex-end;overflow:hidden}
.rv-bar-in{width:100%;background:repeating-linear-gradient(45deg,var(--ink-4),var(--ink-4) 3px,color-mix(in oklab,var(--ink-4),transparent 55%) 3px,color-mix(in oklab,var(--ink-4),transparent 55%) 6px)}

.rv-ix-v{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.rv-ix-h{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--ink-3);padding:10px 8px 4px;border-top:1px solid var(--hair);margin-top:4px}

.rv-spark{display:block;overflow:visible}
.rv-spark-base{stroke:var(--ink-4);stroke-width:1;stroke-dasharray:2 2;opacity:.7}
.rv-spark-l{fill:none;stroke:var(--ink-3);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}

.rv-spark-na{display:block;width:48px}
.rv-gfocus{font-size:11px;color:var(--ink-3);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rv-tag.good{color:var(--ink-3)}
/* класс риска и оценки — точкой и словом, а не плашкой капслоком (D2) */
.rv-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-4);flex:none}

.rv-fi{display:grid;grid-template-columns:1fr 40px 96px;gap:8px;align-items:baseline;padding:5px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;font-size:13px;transition:background .12s}
.rv-fi:hover{background:var(--paper-2)}

.rv-bell:hover{border-color:var(--ink-4);color:var(--ink)}

/* разбор радара — общий с «Обзором» компонент; внутри вкладки — по системе D2:

.rv .bfb-title{font-family:'Source Serif 4',Georgia,serif;font-size:15px;font-weight:600}
.rv .bfb-body em{color:var(--ink);font-weight:600}
.rv .bfb-act-l{font-family:inherit;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink-2)}
.rv-ico-in{display:inline-flex;vertical-align:-2px;margin-left:3px}

/* ── волна D1: карточка жалобы и читалка ─────────────────────────────────── */
.rv-clist{display:flex;flex-direction:column}
.rv-c{position:relative;display:block;margin:0 -10px;padding:12px 14px 12px 20px;border-radius:12px;cursor:pointer;outline:none;
  transition:background-color .15s ease,box-shadow .15s ease,transform .1s ease-out}
.rv-c::after{content:"";position:absolute;left:20px;right:14px;bottom:0;height:1px;background:var(--hair)}
.rv-c:last-child::after,.rv-c:hover::after,.rv-c.sel::after{display:none}
.rv-c:hover{background:var(--paper-2)}
.rv-c:active{transform:scale(.996)}
.rv-c.sel{background:var(--select-soft);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--select),transparent 72%)}
.rv-c:focus-visible{box-shadow:0 0 0 2px var(--select)}
.rv-c.s-neg::before,.rv-c.s-warn::before{content:"";position:absolute;left:8px;top:15px;bottom:15px;width:3px;border-radius:2px}
.rv-c.s-neg::before{background:var(--neg)}
.rv-c.s-warn::before{background:var(--warn)}
.rv-c-meta{display:flex;align-items:center;gap:8px;font-size:12px;line-height:1.35;color:var(--ink-3)}
.rv-c-mt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-c-in{display:inline-flex;align-items:center;gap:4px;flex:none;font-size:12px;font-weight:500;color:var(--select)}
.rv-c-acts{position:absolute;top:7px;right:10px;display:flex;align-items:center;gap:4px;padding-left:24px;opacity:0;transition:opacity .15s ease;
  background:linear-gradient(90deg,transparent,var(--paper-2) 22px)}
.rv-c.sel .rv-c-acts{background:linear-gradient(90deg,transparent,color-mix(in oklab,var(--select),var(--surface) 93%) 22px)}
.rv-c:hover .rv-c-acts,.rv-c:focus-within .rv-c-acts,.rv-c.sel .rv-c-acts{opacity:1}
@media (hover:none){.rv-c-acts{opacity:1;background:linear-gradient(90deg,transparent,var(--surface) 22px)}.rv-c-add{display:none}}
.rv-c-add{height:26px;padding:0 10px;border-radius:8px;border:1px solid var(--hair-2);background:var(--surface);font-size:12px;font-weight:500;color:var(--ink);cursor:pointer}
.rv-c-add:hover{border-color:var(--ink-4)}
.rv-c-add:active{transform:scale(.97)}
.rv-ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--ink-3);cursor:pointer;flex:none;transition:background-color .12s,color .12s}
.rv-ib:hover:not(:disabled){background:var(--paper-2);color:var(--ink)}
.rv-ib:active:not(:disabled){transform:scale(.94)}
.rv-ib:disabled{opacity:.35;cursor:default}
.rv-ib:focus-visible,.rv-bt:focus-visible,.rv-c-add:focus-visible,.rv-c-tl:focus-visible,.rv-rd-simi:focus-visible{outline:2px solid var(--select);outline-offset:1px}
.rv-menu{position:relative;display:inline-flex}
.rv-menu-pop{position:absolute;right:0;top:32px;z-index:30;min-width:220px;padding:6px;border:1px solid var(--hair);border-radius:12px;background:var(--surface);box-shadow:var(--shadow-2);transform-origin:top right;animation:rv-pop .14s var(--ease-out,ease-out) both}
@keyframes rv-pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.rv-menu-pop a,.rv-menu-pop button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;font:inherit;font-size:13px;color:var(--ink);text-decoration:none;cursor:pointer;text-align:left}
.rv-menu-pop a:hover,.rv-menu-pop button:hover{background:var(--paper-2)}
.rv-menu-pop svg{color:var(--ink-3)}
.rv-c-title{margin-top:2px;font-size:15px;line-height:1.38;font-weight:600;letter-spacing:-.005em;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.rv-c.read .rv-c-title{font-weight:500;color:var(--ink-2)}
.rv-c-title.raw{font-weight:400;font-family:'Source Serif 4',Georgia,serif;color:var(--ink-2)}
.rv-c-quote{margin-top:4px;font-family:'Source Serif 4',Georgia,serif;font-style:italic;font-size:13px;line-height:1.45;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-c-snip{margin-top:4px;font-size:13px;line-height:1.45;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rv-c-sig{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:6px;font-size:12px;line-height:1.3}
.rv-sg{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2);font-weight:500}
.rv-sg svg{flex:none;opacity:.85}
.rv-sg.neg{color:var(--neg)}
.rv-sg.warn{color:var(--warn-ink)}
.rv-sg.pos{color:var(--pos)}
.rv-c-th{margin-left:auto;display:inline-flex;align-items:center;flex-wrap:wrap;min-width:0}
.rv-c-tl{border:0;background:none;padding:0;font:inherit;font-size:12px;color:var(--ink-3);cursor:pointer;border-radius:4px}
.rv-c-tl:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.rv-c-tl.static{cursor:inherit}
.rv-c-tl.static:hover{color:var(--ink-3);text-decoration:none}
.rv-c-dot{color:var(--ink-3);margin:0 6px}
.rv-legend{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.rv-legend i{display:inline-block;width:3px;height:11px;border-radius:2px;margin-left:8px}
.rv-legend i:first-child{margin-left:0}
.rv-legend i.neg{background:var(--neg)}
.rv-legend i.warn{background:var(--warn)}
.rv-keys{margin-left:14px;color:var(--ink-3)}
@media (hover:none){.rv-keys{display:none}}
/* лента: список и читалка рядом */
.rv-fw.split{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:22px;align-items:start}
.rv-fw-rd{position:sticky;top:calc(var(--topbar) + 12px);max-height:calc(100vh - var(--topbar) - 24px);overflow:auto;overscroll-behavior:contain;
  border:1px solid var(--hair);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-2);animation:rv-rd-in .22s var(--ease-spring) both}
@keyframes rv-rd-in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
/* читалка */
.rv-rd{display:flex;flex-direction:column;min-height:0;height:100%;background:var(--surface)}
.rv-rd.emb{height:auto}
.rv-rd-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 14px;
  background:color-mix(in oklab,var(--surface),transparent 10%);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
  box-shadow:0 1px 0 var(--hair)}
.rv-rd-nav,.rv-rd-acts{display:flex;align-items:center;gap:4px;min-width:0}
.rv-rd-acts{gap:6px;flex:none}
.rv-rd-pos{margin-left:6px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.rv-bt{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--hair-2);background:var(--surface);
  font:inherit;font-size:13px;font-weight:500;color:var(--ink);text-decoration:none;cursor:pointer;white-space:nowrap;transition:background-color .12s,border-color .12s,transform .1s ease-out}
.rv-bt:hover{border-color:var(--ink-4)}
.rv-bt:active{transform:scale(.97)}
.rv-bt svg{flex:none}
.rv-bt.pri{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.rv-bt.pri:hover{background:color-mix(in oklab,var(--ink),var(--surface) 14%)}
.rv-bt.done{color:var(--select);border-color:color-mix(in oklab,var(--select),transparent 55%);background:var(--select-soft)}
.rv-rd-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 28px 44px}
.rv-rd.emb .rv-rd-body{overflow:visible;padding:18px 24px 36px}
.rv-rd-meta{font-size:13px;color:var(--ink-3)}
.rv-rd-title{margin:6px 0 16px;font-size:17px;line-height:1.4;font-weight:600;letter-spacing:-.01em;color:var(--ink);text-wrap:pretty}
.rv-rd-title.raw{font-weight:400;font-family:'Source Serif 4',Georgia,serif}
.rv-rd-pending{margin:-8px 0 16px;font-size:13px;color:var(--ink-3)}
.rv-pass{display:grid;grid-template-columns:96px minmax(0,1fr);gap:7px 16px;margin:0 0 24px;padding:14px 16px;border-radius:12px;background:var(--paper-2);font-size:13px;line-height:1.45}
.rv-pass dt{color:var(--ink-3)}
.rv-pass dd{color:var(--ink);min-width:0}
.rv-risk{display:inline-flex;align-items:center;gap:5px;margin-left:10px;font-size:12px;color:var(--ink-3)}
.rv-risk::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-4)}
.rv-risk.compliance::before{background:var(--neg)}
.rv-risk.conduct::before{background:var(--warn)}
.rv-tneg{color:var(--neg);font-weight:500}
.rv-twarn{color:var(--warn-ink);font-weight:500}
.rv-dim{color:var(--ink-3)}
.rv-stars i{font-style:normal;color:var(--hair-2);letter-spacing:1px}
.rv-stars i.on{color:var(--warn)}
.rv-rd-sec{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:0 0 10px;font-size:11px;font-weight:600;color:var(--ink-3)}
.rv-rd-sec-n{font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.rv-rd-text{max-width:66ch;font-family:'Source Serif 4',Georgia,serif;font-size:16px;line-height:1.65;color:var(--ink);text-wrap:pretty}
.rv-rd-text p{margin:0 0 .9em}
.rv-qhl{background:var(--qhl);color:inherit;border-radius:3px;padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rv-rd-reply{margin-top:22px;padding:14px 16px 12px;border-left:3px solid var(--hair-2);border-radius:0 12px 12px 0;background:var(--paper-2)}
.rv-rd-rtext{max-width:66ch;font-size:13px;line-height:1.55;color:var(--ink-2);max-height:9.3em;overflow:hidden}
.rv-rd-reply.open .rv-rd-rtext{max-height:none}
.rv-rd-rtext p{margin:0 0 .6em}
.rv-lnkb{margin-top:6px;padding:0;border:0;background:none;font:inherit;font-size:13px;font-weight:500;color:var(--select);cursor:pointer}
.rv-rd-sim{margin-top:28px}
.rv-rd-simi{display:flex;flex-direction:column;gap:3px;width:100%;margin-bottom:8px;padding:10px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);text-align:left;font:inherit;cursor:pointer;transition:border-color .12s,transform .1s ease-out}
.rv-rd-simi:hover{border-color:var(--ink-4)}
.rv-rd-simi:active{transform:scale(.99)}
.rv-rd-simm{font-size:12px;color:var(--ink-3)}
.rv-rd-simt{font-size:13px;line-height:1.4;font-weight:500;color:var(--ink)}
/* окно читалки: широкая панель справа, на телефоне — лист снизу */
.rv-ovl-card.rv-ovl-right.rv-ovl-wide{width:min(680px,100vw)}
.rv-ovl-bare{padding:0}
.rv-ovl-bare>.rv-rd{height:100%}
.rv-ovl.rv-ovl-sheet{align-items:flex-end;padding:0}
.rv-ovl-card.rv-sheet{width:100vw;height:92vh;max-height:92vh;border-radius:16px 16px 0 0;border:none;animation:rv-sheet-up var(--dur-base) var(--ease-spring) both}
.rv-sheet [data-drag]{touch-action:none}
.rv-sheet-grab{display:flex;justify-content:center;padding:8px 0 0;flex:none;cursor:grab;background:var(--surface)}
.rv-sheet-grab i{width:36px;height:5px;border-radius:3px;background:var(--hair-2)}
.rv-sheet .rv-rd-body{padding:16px 18px 40px}
@keyframes rv-sheet-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes rv-sheet-down{from{transform:none}to{transform:translateY(100%)}}
.rv-ovl.is-closing .rv-ovl-card.rv-sheet{animation:rv-sheet-down var(--dur-quick,180ms) var(--ease-out,ease-out) both}
@media(prefers-reduced-motion:reduce){.rv-ovl-card.rv-sheet,.rv-fw-rd,.rv-menu-pop{animation:none}.rv-c,.rv-c:active,.rv-bt:active{transform:none}}
@media(max-width:760px){.rv-c{padding:12px 12px 12px 18px;margin:0 -6px}.rv-c-th{margin-left:0}.rv-rd-head{padding:6px 10px 10px}.rv-rd-pos{max-width:120px}}
/* дело: жалоба-карточка и комментарий под ней */
.rv-ci .rv-c{margin:0 -8px}
.rv-ci .rv-c::after{display:none}
.rv-ci-foot{display:flex;align-items:flex-start;gap:6px;margin:2px 0 0 12px}
.rv-ci-foot .rv-ci-note{flex:1;margin-top:0}
.rv-ci{padding-bottom:12px;border-bottom:1px solid var(--hair)}
@media(max-width:920px){.rv-flags-g{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.rv-flags-g{grid-template-columns:1fr;gap:12px}.rv-flags>.rv-ct{flex-direction:column;gap:0}.rv-flags-sum{margin-bottom:12px}.rv-fi-l{white-space:normal}.rv-ct{flex-wrap:wrap}.rv-chg-it{white-space:normal}}
.rv-lnk{font-size:11px;color:var(--ink-2);text-decoration:none}
.rv-lnk:hover{text-decoration:underline}
.rv-clear{color:var(--ink-2);cursor:pointer;}
.rv-clear:hover{text-decoration:underline}
.rv-note{padding:24px 8px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.4}
.rv-trow:focus-visible,.rv-clear:focus-visible,.rv-grow-click:focus-visible,.rv-bcol:focus-visible,.rv-ovl-x:focus-visible,.rv-explain-btn:focus-visible{outline:2px solid var(--select);outline-offset:2px;border-radius:4px}

/* доверие к данным */

.rv-lown{color:var(--ink-3);font-size:11px}

/* объяснение выдачи поиска: по каким словам искали и откуда взялся отзыв.
   Тот же язык, что и в базе знаний (.kb-summary / .kb-hl) — намеренно. */
.rv-sum{font-size:11px;color:var(--ink-3);
  padding:2px 2px 12px;display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.rv-sum b{color:var(--ink-2);font-weight:500}
.rv-sum-x{padding-left:14px;border-left:1px solid var(--hair)}
/* «по смыслу» — совпадения слов нет, отзыв подобран моделью: приглушаем,
   чтобы дословное попадание читалось как более надёжное */

/* полоса-предупреждение над лентой. Не .rv-note: тот — блок пустого состояния
   с отступом 26px по центру, над списком он выглядел бы как обрыв вёрстки */
.rv-warn{font-size:11px;line-height:1.45;color:var(--ink-2);
  background:color-mix(in oklab,var(--warn),transparent 90%);
  border-left:2px solid var(--warn);border-radius:0 4px 4px 0;padding:6px 10px;margin:0 0 12px}

/* массовость / клик-аффордансы ленты */

/* разбор отзыва моделью: суть и признаки под шапкой карточки */


/* кликабельные столбцы тренда / города */
.rv-bcol{cursor:pointer}
.rv-bcol:hover .rv-bar{filter:brightness(.92)}
.rv-bar.part{background:repeating-linear-gradient(45deg,var(--ink-4),var(--ink-4) 3px,transparent 3px,transparent 6px)!important;opacity:.7}
.rv-grow-click{cursor:pointer;border-radius:6px;transition:background .12s;margin:0 -6px;padding-left:6px;padding-right:6px}
.rv-grow-click:hover{background:var(--paper-2)}

/* оверлей: модал + правый драуэр */
.rv-ovl{position:fixed;inset:0;z-index:200;background:color-mix(in oklab,var(--ink),transparent 78%);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade-in .14s ease}
.rv-ovl-r{padding:0;align-items:stretch}
.rv-ovl-card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);box-shadow:var(--shadow-2);width:760px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.rv-ovl-right{margin-left:auto;margin-right:0;height:100vh;max-height:100vh;width:560px;border-radius:0;border-right:none;border-top:none;border-bottom:none}
.rv-ovl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px;border-bottom:1px solid var(--hair);flex:none}
.rv-ovl-x{width:30px;height:30px;flex:none;border-radius:6px;border:1px solid var(--hair-2);background:var(--surface);color:var(--ink-3);cursor:pointer;font-size:14px;line-height:1}
.rv-ovl-x:hover{background:var(--paper-2);color:var(--ink)}
.rv-ovl-body{padding:16px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--hair-2) transparent}
.rv-ovl-body::-webkit-scrollbar{width:8px}
.rv-ovl-body::-webkit-scrollbar-thumb{background:var(--hair-2);border-radius:4px;border:2px solid var(--surface)}

/* LLM-объяснение в драуэре */
.rv-explain-btn{width:100%;height:38px;border-radius:8px;border:1px solid var(--hair-2);background:var(--surface);color:var(--ink);font-size:12px;font-weight:500;cursor:pointer;transition:background .12s}
.rv-explain-btn:hover:not(:disabled){background:var(--paper-2);border-color:var(--ink-4)}
.rv-explain-btn:disabled{opacity:.6;cursor:default}
.rv-prof{margin:0 0 12px;padding:10px 12px;border:1px solid var(--hair);border-radius:8px;background:var(--surface)}

.rv-prof-r{display:grid;grid-template-columns:1fr 32px 150px 44px;gap:8px;align-items:baseline;padding:4px 0;border-top:1px solid var(--hair);font-size:13px}

.rv-explain{margin:12px 0;padding:12px 14px;border-radius:8px;background:var(--paper-2);border:1px solid var(--hair);font-size:13px;line-height:1.55;color:var(--ink)}
